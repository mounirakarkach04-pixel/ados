name: Nadia v27 Live Parity (Read-only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nadias-bloom/**'
      - 'scripts/check_nadia_v27_live.cjs'
      - 'scripts/test_nadia_v27_pure.cjs'
      - '.github/workflows/nadia-v27-live-parity.yml'
permissions:
  contents: read
concurrency:
  group: nadia-v27-readonly-parity
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout public app sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Node version
        run: node --version
      - name: Verify Nadia v27 source invariants (offline, no dependencies)
        run: node scripts/test_nadia_v27_pure.cjs
      - name: Verify GitHub Pages and Cloudflare bytes (GET only)
        run: node scripts/check_nadia_v27_live.cjs
