name: PIGA ORTHO 3D — Android APK evaluation
on:
  workflow_dispatch:
  push:
    paths:
      - 'piga-ortho-3d/**'
      - '.github/workflows/piga-ortho-3d-apk.yml'
jobs:
  android-debug-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify preinstalled Android SDK
        run: |
          test -n "$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" || test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "Using Android SDK from runner image"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build current offline device-first APK
        working-directory: piga-ortho-3d/android
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify newest Ortho assets and native scheduled runner inside APK
        run: |
          set -euo pipefail
          grep -Fq 'OrthoLocalRunnerJob.schedule' piga-ortho-3d/android/app/src/main/java/com/piga/ortho/MainActivity.java
          grep -Fq 'BIND_JOB_SERVICE' piga-ortho-3d/android/app/src/main/AndroidManifest.xml
          grep -Fq "(!state.key&&!state.nativeReady)" piga-ortho-3d/app.js
          for f in index.html dashboard.html studio.html app.js dental-anatomy.js device-resilience.js device-worker.js device-store.js device-hub.html resilience-status.js navigation.js sw.js setup.html setup.js ortho-ai-status.js manifest.webmanifest visuals/ortho-hero.svg; do
            test -s "piga-ortho-3d/$f"
            unzip -p "piga-ortho-3d/android/app/build/outputs/apk/debug/app-debug.apk" "assets/$f" | cmp - "piga-ortho-3d/$f"
            echo "PASS Android asset: $f"
          done
      - name: Publish build artifact, not a clinical release
        uses: actions/upload-artifact@v4
        with:
          name: PIGA-ORTHO-3D-DEVICE-FIRST-debug-APK
          path: piga-ortho-3d/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
