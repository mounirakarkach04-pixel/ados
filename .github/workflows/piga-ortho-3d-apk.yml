name: PIGA ORTHO 3D — Android APK evaluation
on:
  workflow_dispatch:
  push:
    paths:
      - 'piga-ortho-3d/android/**'
      - 'piga-ortho-3d/web/**'
      - '.github/workflows/piga-ortho-3d-apk.yml'
jobs:
  android-debug-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build offline evaluation APK
        working-directory: piga-ortho-3d/android
        run: gradle --no-daemon :app:assembleDebug
      - name: Publish build artifact, not a clinical release
        uses: actions/upload-artifact@v4
        with:
          name: PIGA-ORTHO-3D-EVALUATION-debug-APK
          path: piga-ortho-3d/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
