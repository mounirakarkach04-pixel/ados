name: PIGA ORTHO 3D — Android APK evaluation
on:
  workflow_dispatch:
  push:
    paths:
      - 'piga-ortho-3d/android/**'
      - 'piga-ortho-3d/web/**'
      - '.github/workflows/piga-ortho-3d-apk.yml'
jobs:
  android-debug-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify preinstalled Android SDK
        run: |
          test -n "$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" || test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "Using Android SDK from runner image"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build offline evaluation APK
        working-directory: piga-ortho-3d/android
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify exact offline assets inside built APK (PIGA A7SEM Reverse)
        run: |
          set -euo pipefail
          grep -Fq "(!state.key&&!state.nativeReady)" piga-ortho-3d/web/app.js
          grep -Fq '"id":"./"' piga-ortho-3d/web/manifest.webmanifest
          for f in index.html app.js style.css sw.js icon.svg manifest.webmanifest privacy.html README.txt workflow.html workflow.css workflow.js praxis.html praxis.css praxis.js dashboard.html dashboard.css dashboard.js navigation.css navigation.js report.html report.css report.js; do
            cmp "piga-ortho-3d/$f" "piga-ortho-3d/web/$f"
            unzip -p "piga-ortho-3d/android/app/build/outputs/apk/debug/app-debug.apk" "assets/$f" | cmp - "piga-ortho-3d/web/$f"
            echo "Verified offline APK asset: $f"
          done
      - name: Publish build artifact, not a clinical release
        uses: actions/upload-artifact@v4
        with:
          name: PIGA-ORTHO-3D-EVALUATION-debug-APK
          path: piga-ortho-3d/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
