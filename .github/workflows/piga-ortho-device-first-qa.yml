name: PIGA ORTHO 3D — Device-first QA
on:
  pull_request:
    paths:
      - 'piga-ortho-3d/**'
      - 'scripts/piga-ortho-showroom-keyless-qa.mjs'
      - 'scripts/piga-unified-kfo-shop-qa.mjs'
      - '.github/workflows/piga-ortho-device-first-qa.yml'
  push:
    branches: [main]
    paths:
      - 'piga-ortho-3d/**'
      - 'scripts/piga-ortho-device-qa.mjs'
      - 'scripts/piga-ortho-autonomy-qa.mjs'
      - 'scripts/piga-ortho-offline-failover-qa.mjs'
      - 'scripts/piga-ortho-webgl-qa.mjs'
      - 'scripts/piga-ortho-manager-qa.mjs'
      - 'scripts/piga-female-persona-qa.mjs'
      - 'scripts/piga-ortho-pc-runner.mjs'
      - 'scripts/piga-ortho-operations-runtime-qa.mjs'
      - 'scripts/piga-ortho-handoff-qa.mjs'
      - 'scripts/piga-ortho-function-readiness-qa.mjs'
      - 'scripts/piga-ortho-workspace-integrity-qa.mjs'
      - 'scripts/piga-ortho-imaging-qa.mjs'
      - 'scripts/piga-ortho-control-qa.mjs'
      - 'scripts/piga-ortho-setup-qa.mjs'
      - 'scripts/piga-ortho-ai-connection-qa.mjs'
      - 'scripts/piga-ortho-supply-atlas-qa.mjs'
      - 'scripts/piga-ortho-onboarding-qa.mjs'
      - 'scripts/piga-ortho-procurement-qa.mjs'
      - '.github/workflows/piga-ortho-device-first-qa.yml'
  workflow_dispatch:
jobs:
  device-first:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify local-first worker, data safety and responsive layout
        run: |
          node scripts/piga-ortho-device-qa.mjs
          node scripts/piga-ortho-autonomy-qa.mjs
          node scripts/piga-ortho-offline-failover-qa.mjs
          node scripts/piga-ortho-webgl-qa.mjs
          node scripts/piga-ortho-render-voice-qa.mjs
          node scripts/piga-ortho-showroom-keyless-qa.mjs
          node scripts/piga-unified-kfo-shop-qa.mjs
          node scripts/piga-ortho-manager-qa.mjs
          node scripts/piga-female-persona-qa.mjs
          node scripts/piga-ortho-operations-runtime-qa.mjs
          node scripts/piga-ortho-handoff-qa.mjs
          node scripts/piga-ortho-function-readiness-qa.mjs
          node scripts/piga-ortho-workspace-integrity-qa.mjs
          node scripts/piga-ortho-imaging-qa.mjs
          node scripts/piga-ortho-control-qa.mjs
          node scripts/piga-ortho-setup-qa.mjs
          node scripts/piga-ortho-ai-connection-qa.mjs
          node scripts/piga-ortho-supply-atlas-qa.mjs
          node scripts/piga-ortho-onboarding-qa.mjs
          node scripts/piga-ortho-procurement-qa.mjs
          node quality/kfo-sales-parity.test.mjs
