name: Nadia Bloom Release Browser & Offline QA
on:
  workflow_dispatch:
  push:
    paths:
      - 'nadias-bloom/**'
      - 'scripts/test_nadia_v33_release.cjs'
      - 'scripts/test_nadia_v27_pure.cjs'
      - '.github/workflows/nadia-bloom-release-qa.yml'
  pull_request:
    branches: [main]
    paths:
      - 'nadias-bloom/**'
      - 'scripts/test_nadia_v33_release.cjs'
      - '.github/workflows/nadia-bloom-release-qa.yml'
permissions:
  contents: read
concurrency:
  group: nadia-bloom-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium (existing free CI path)
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Preserve existing calendar/prayer pure regressions
        run: node scripts/test_nadia_v27_pure.cjs
      - name: Verify v33 source, mobile navigation, no-login, RTL and offline
        run: |
          node scripts/test_nadia_v33_release.cjs --static
          node scripts/test_nadia_v33_release.cjs --browser
