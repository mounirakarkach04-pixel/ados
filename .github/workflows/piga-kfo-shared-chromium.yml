name: PIGA Shared KFO AI · Chromium
on:
  pull_request:
    paths:
      - 'piga-ortho-3d/**'
      - 'quality/piga-kfo-shared-browser.mjs'
      - '.github/workflows/piga-kfo-shared-chromium.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  governed-kfo-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Chromium runner
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/piga-kfo-browser.log 2>&1 &
          sleep 3
      - name: Verify consent, mobile layout and fail-closed model routes
        run: node quality/piga-kfo-shared-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: piga-kfo-shared-ai-browser-evidence
          path: qa-artifacts/kfo-shared/
          if-no-files-found: ignore
          retention-days: 14
