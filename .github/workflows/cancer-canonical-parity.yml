name: PIGA Cancer Canonical pigapocket.com Readback (bounded)
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/verify_cancer_canonical_parity.py'
      - '.github/workflows/cancer-canonical-parity.yml'
      - 'cancer-system-state/book.html'
      - 'cancer-system-state/index.html'
      - 'cancer/index.html'
permissions:
  contents: read
concurrency:
  group: cancer-canonical-parity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  canonical-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout evidence source
        uses: actions/checkout@v4
      - name: Verify six production routes and hashes with at most seven reads
        run: python3 scripts/verify_cancer_canonical_parity.py
