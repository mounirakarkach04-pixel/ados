name: PIGA ONE Shared Voice Source QA
on:
  pull_request:
    paths:
      - 'quality/piga-assistant-widget.mjs'
      - 'piga-ortho-3d/ortho-ai-status.js'
      - 'scripts/verify-piga-shared-voice-profiles.mjs'
      - '.github/workflows/piga-shared-voice-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check quality/piga-assistant-widget.mjs
      - run: node --check piga-ortho-3d/ortho-ai-status.js
      - run: node scripts/verify-piga-shared-voice-profiles.mjs
