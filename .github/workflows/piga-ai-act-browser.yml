name: PIGA AI Act Chromium E2E
on:
  workflow_dispatch:
  push:
    paths:
      - 'ai-act-intelligence/**'
      - 'quality/piga-ai-act-browser.mjs'
      - '.github/workflows/piga-ai-act-browser.yml'
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser runner
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Start static test server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/piga-aiact-server.log 2>&1 &
          sleep 3
      - name: Execute real Chromium workflow
        run: node quality/piga-ai-act-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: piga-ai-act-browser-evidence
          path: qa-artifacts/
          if-no-files-found: ignore
          retention-days: 14
