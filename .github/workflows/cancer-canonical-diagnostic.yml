name: PIGA Cancer Canonical Asset Version Diagnostic (read only)
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/diagnose_cancer_canonical.py'
      - '.github/workflows/cancer-canonical-diagnostic.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/diagnose_cancer_canonical.py
