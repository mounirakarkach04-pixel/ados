name: PIGA KFO Public Canonical Live Readback (read-only)
on:
  pull_request:
    paths:
      - 'scripts/piga-ortho-public-readback.mjs'
      - '.github/workflows/piga-ortho-public-readback.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canonical-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect live Cloudflare public routes without inference
        run: node scripts/piga-ortho-public-readback.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: piga-ortho-public-readback
          path: release-evidence/piga-ortho-public-readback.json
          retention-days: 3
