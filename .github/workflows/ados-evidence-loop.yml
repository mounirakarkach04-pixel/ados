name: ADOS Evidence Studio — 3× Browser & Logic QA
on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'studio.html'
      - 'datenschutz.html'
      - 'nutzungsbedingungen.html'
      - 'downloads/ADOS_Governance_Lite_v0_6_OFFLINE.html'
      - 'scripts/test_ados_evidence.cjs'
      - 'scripts/ados_browser_worker.cjs'
      - '.github/workflows/ados-evidence-loop.yml'
permissions:
  contents: read
concurrency:
  group: ados-evidence-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bounded-synthetic-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser dependencies in ephemeral worker only
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Reproduce theoretical and synthetic checks in three bounded iterations
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            echo "ADOS SYNTHETIC LOOP $i/3"
            node scripts/test_ados_evidence.cjs .
          done
      - name: Actual Chromium desktop/mobile/file offline integration
        run: node scripts/ados_browser_worker.cjs
      - name: Print report and paths
        if: always()
        shell: bash
        run: |
          if test -s qa-reports/ados-evidence-loop.json; then
            node -e 'const d=require("./qa-reports/ados-evidence-loop.json");console.log(JSON.stringify({status:d.status,loops:d.finishedLoops,checks:d.checks.length,failures:d.failures.length,live:d.live.map(x=>({url:x.host+x.p,status:x.status,same:x.hashMatch}))},null,2))'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ADOS-evidence-QA-${{ github.run_id }}
          path: qa-reports/ados-evidence-loop.json
          retention-days: 30
          if-no-files-found: warn
