name: Nadia Bloom v28 Live Links (Read-only)
on:
  workflow_dispatch:
  push:
    paths:
      - 'nadias-bloom/**'
      - 'scripts/verify_nadias_bloom_live.js'
      - '.github/workflows/nadia-bloom-live-readback.yml'
permissions:
  contents: read
concurrency:
  group: nadia-live-readback
  cancel-in-progress: true
jobs:
  live-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify canonical PWA and backup without AI calls
        run: node scripts/verify_nadias_bloom_live.js
