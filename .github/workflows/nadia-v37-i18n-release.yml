name: Nadia Bloom v37 · Market Polish and Full Localization Gate
on:
  push:
    branches:
      - release/nadia-v37-management-polish-20261028
    paths:
      - scripts/nadia_i18n_parallel_v37.py
      - .github/workflows/nadia-v37-i18n-release.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nadia-v37-release-localization
  cancel-in-progress: false
jobs:
  compile-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile full 15-language local source package (no user data)
        run: python -u scripts/nadia_i18n_parallel_v37.py
      - name: Enforce no missing translations and correct standalone parity
        run: |
          node scripts/test_nadia_v36_all_languages.cjs --static
          node scripts/test_nadia_v33_release.cjs --static
      - name: Prepare isolated Chromium for mobile product checks
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test all 15 languages, input protection, Arabic RTL and airplane mode
        run: node scripts/test_nadia_v36_all_languages.cjs --browser
      - name: Verify management calendar, offline and family functional regressions
        run: node scripts/test_nadia_v33_release.cjs --browser
      - name: Commit full language pack, verified HTML and reusable translation receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/nadia_i18n_v36_cache.json nadias-bloom/index.html nadias-bloom/Nadias_Bloom_Offline.html
          if ! git diff --cached --quiet; then
            git commit -m "release(nadia): full 15-language translated market-ready v37 offline planner"
            git push origin HEAD:release/nadia-v37-management-polish-20261028
          fi
      - name: Archive responsive calendar visuals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nadia-v37-fifteen-languages-calendar
          path: qa-nadia-v34-calendar-*.png
          if-no-files-found: ignore
          retention-days: 7
