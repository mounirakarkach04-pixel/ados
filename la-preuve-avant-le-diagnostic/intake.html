const date=text.match(/\b20\d\d-\d\d-\d\d\b/);if(date)put('date',date[0]);
const method=lines.find(l=>/^(?:methode|method|méthode|assay|instrument|analyse) *[:=]/i.test(l));if(method)put('method',method.replace(/^[^:=]+[:=]\s*/,''));
const unit=lines.find(l=>/^(?:einheit|scale|échelle|unités|units|intervalle|skala) *[:=]/i.test(l));if(unit)put('units',unit.replace(/^[^:=]+[:=]\s*/,''));
return n
}
async function process(f){
file={name:'',sha256:'',characters:0,parseError:'',excerpt:''};$('fileStatus').textContent=C.t.emptyFile;
if(!f)return;
if(f.size>5*1024*1024){file.parseError=C.t.fileTooBig;$('fileStatus').textContent=file.parseError;return}
file.name=f.name;
try{
const [text,hash]=await Promise.all([extract(f),sha256(await f.arrayBuffer())]);
if(!text.trim())throw Error('No extractable text');
file.characters=text.length;file.sha256=hash;
file.excerpt=text.slice(0,1100);
if(!/^[\S\s]{0,10000}$/.test(text))throw Error('Invalid document');
const proposed=suggest(text);
$('fileStatus').textContent=C.t.fileDone+': '+f.name+' · '+file.characters+' caractères/Zeichen · '+proposed+' Vorschläge/suggestions (non validées).';
}catch(e){file.parseError=human(e?.message||C.t.fileError);$('fileStatus').textContent=C.t.fileError+' ('+file.parseError.slice(0,90)+')'}
}
$('file').addEventListener('change',e=>{void process(e.target.files?.[0])});
const drag=$('drop');
drag.addEventListener('dragover',e=>{e.preventDefault();drag.classList.add('hover')});
drag.addEventListener('dragleave',()=>drag.classList.remove('hover'));
drag.addEventListener('drop',e=>{e.preventDefault();drag.classList.remove('hover');if(e.dataTransfer.files[0])void process(e.dataTransfer.files[0])});
$('sample').onclick=()=>{
$('kind').value='SYNTHETIC';$('purpose').value='RESEARCH';
$('claim').value=C.t.sampleClaim;$('values').value=C.t.sampleValues;$('source').value=C.t.sampleSource;
$('date').value='2026-01-01';$('method').value=C.t.sampleMethod;$('units').value=C.t.sampleUnits;
$('alternate').value=C.t.sampleAlternative;$('consent').checked=true;
$('risk').value='';$('blockProof').value='';$('indProof').value='';
file={name:'synthetic-inline',sha256:'',characters:0,parseError:'',excerpt:''};$('fileStatus').textContent=C.t.demo;
};
$('clear').onclick=()=>{if(!confirm(C.t.clear+'?'))return;$('auditForm').reset();file={name:'',sha256:'',characters:0,parseError:'',excerpt:''};last=null;$('status').textContent=C.t.stateUnknown;$('status').className='status unknown';$('fileStatus').textContent=C.t.emptyFile;$('questions').textContent='';$('reason').textContent=C.t.resultIntro;$('coverage').textContent='—';$('count').textContent='—';$('export').disabled=$('exportCsv').disabled=true;$('vbr-status').textContent=C.t.vbrNo;$('vbr-reason').textContent=C.t.vbrDefault};
$('auditForm').onsubmit=e=>{
e.preventDefault();
const f=fields(),kind=$('kind').value,purpose=$('purpose').value,consent=$('consent').checked;
const fieldsPresent=REQUIRED.filter(x=>f[x[0]]);
const coverage=REQUIRED.reduce((s,x)=>s+(f[x[0]]?x[1]:0),0)/REQUIRED.reduce((s,x)=>s+x[1],0);
let gaps=REQUIRED.filter(x=>!f[x[0]]).map(x=>({id:x[0],label:words[x[0]],question:question[x[0]],weight:x[1]}));
if(!f.values&&file.characters===0)gaps.push({id:'evidence',question:C.lang==='de'?'Welche Beobachtungsdaten liegen vor?':'Quelles observations sont disponibles ?',weight:3});
if(file.parseError)gaps.push({id:'file',question:C.t.fileError,weight:3});
if(!f.alternate&&file.characters>0)gaps.push({id:'independent_review',question:question.alternate,weight:3});
let state='UNKNOWN',why=C.t.unknownReason;
if(kind==='PERSONAL'||purpose==='CLINICAL'||!consent){state='BLOCK';why=C.t.blockReason}
else if(file.parseError){state='UNKNOWN';why=C.t.fileError}
else if(!f.claim||!f.source){state='UNKNOWN'}
else if(gaps.length){state='DELAY';why=C.t.delayReason}
else{state='ALLOW';why=C.t.passReason}
const axes=[
['Observation',Boolean(f.values)||file.characters>0],
['Expression',Boolean(f.claim)],
['Provenance',Boolean(f.source)],
['Method',Boolean(f.method)],
['Time',Boolean(f.date)],
['Alternative',Boolean(f.alternate)],
['Reversibility',Boolean(f.units&&f.alternate)]
].map(([axis,present],i)=>({stage:i+1,axis,present}));
const reverse=[['source',Boolean(f.source)],['sampleDate',Boolean(f.date)],['method',Boolean(f.method)],['scales',Boolean(f.units)],['counterHypothesis',Boolean(f.alternate)],['scope',kind!=='PERSONAL'&&purpose!=='CLINICAL']].map(([name,answer])=>({name,answer}));
const vbrReady=Boolean(f.risk&&f.blockProof&&f.indProof);
const vbr={state:vbrReady?'SELF_REPORTED_EVIDENCE_CANDIDATE_NOT_VERIFIED':'UNVERIFIED',claimedRisk:!!f.risk,documentedGate:!!f.blockProof,independentReadbackClaim:!!f.indProof,thirdPartyReadbackPerformed:false,actualExternalNonExecutionVerified:false,disclaimer:'User-entered references are not independently verified. A BLOCK is not itself VBR.'};
last={schema:'piga.shared.document-intake.v1',app:C.app,createdAt:new Date().toISOString(),inputKind:kind,requestedPurpose:purpose,gate1:state,gate2:'BLOCK:individual-consequential-action',metadataCoverage:Number(coverage.toFixed(4)),scoreMeaning:'Weighted presence of seven documentary metadata fields, not accuracy, likelihood or clinical validation',gaps,a7sem:axes,a7semReverse:reverse,vbr,file:{name:file.name,sha256:file.sha256,characters:file.characters,error:file.parseError},rawDocumentExported:false,noExternalActionsPerformedByThisClient:true,privacyConfirmation:consent};
$('status').textContent=state+' · GATE 1';$('status').className='status '+(state==='BLOCK'?'block':state==='ALLOW'?'allow':state==='DELAY'?'delay':'unknown');
$('reason').textContent=why;$('coverage').textContent=Math.round(coverage*100)+' %';$('count').textContent=String(gaps.length);
$('questions').replaceChildren(...(gaps.length?gaps:[{question: C.lang==='de'?'Metadaten vollständig. Unabhängige Validierung der Aussagen steht aus.':'Champs présents. Les affirmations doivent encore être validées indépendamment.'}]).map(g=>{const li=document.createElement('li');li.textContent=g.question;return li}));
$('stages').replaceChildren(...axes.map(a=>{const span=document.createElement('span');span.className=a.present?'ok':'';span.title=a.axis;span.textContent=a.stage;return span}));
$('reverse').textContent=C.t.reverse+': '+reverse.filter(x=>!x.answer).map(x=>x.name).join(' · ')+(reverse.every(x=>x.answer)?' · metadata checks complete (not externally validated)':'');
$('vbr-status').textContent=vbrReady?C.t.vbrCandidate:C.t.vbrNo;
$('vbr-reason').textContent=C.t.vbrDescription;
$('vbr-risk').textContent=f.risk?'●':'—';$('vbr-control').textContent=f.blockProof?'●':'—';$('vbr-evidence').textContent=f.indProof?'●':'—';
$('export').disabled=$('exportCsv').disabled=false;
$('result').scrollIntoView({behavior:'smooth',block:'start'});
};
$('export').onclick=()=>{if(last)download('PIGA_'+C.app+'_EVIDENCE_PASSPORT.json',JSON.stringify(last,null,2),'application/json')};
$('exportCsv').onclick=()=>{if(last)download('PIGA_'+C.app+'_GAPS.csv',['id;item;question;weight',...last.gaps.map(g=>[g.id||'',g.label||'',g.question||'',g.weight||''].map(csv).join(';'))].join('\r\n'),'text/csv;charset=utf-8')};
window.PIGA_SHARED_INTAKE_QA={app:C.app,version:'v1.0',gate2:'BLOCK',sample:()=>$('sample').click(),run:()=>document.getElementById('auditForm').requestSubmit(),report:()=>last};
})();
</script></body></html>
