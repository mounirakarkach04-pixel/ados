l\">Workbench\u003c/a>\u003ca href=\"studio.html\" class=\"active\" aria-current=\"page\">Studio\u003c/a>\u003ca href=\"evaluation.html\">Étude\u003c/a>\u003c/nav>\u003cspan class=\"author\">MOUNIR AKARKACH\u003c/span>\u003c/div>\u003c/header>\n\u003csection class=\"hero\">\u003cdiv class=\"wrap\">\u003cspan class=\"eyebrow\">Mounir Akarkach · La preuve avant le diagnostic\u003c/span>\u003ch1>Bienvenue dans l’univers de la preuve.\u003c/h1>\u003cp class=\"lead\">Un studio interactif pour examiner les données avant toute inférence : cas synthétiques, qualité documentaire, probabilités et communication pédagogique.\u003c/p>\n\u003cnav class=\"steps\" aria-label=\"Guide rapide\">\u003ca class=\"step\" href=\"index.html\">\u003cspan class=\"num\">1\u003c/span>\u003cspan>\u003cb>Découvrir le livre\u003c/b>\u003csmall>Lire les fondements\u003c/small>\u003c/span>\u003c/a>\u003ca class=\"step\" href=\"#cases\">\u003cspan class=\"num\">2\u003c/span>\u003cspan>\u003cb>Tester l’application\u003c/b>\u003csmall>Charger un cas fictif\u003c/small>\u003c/span>\u003c/a>\u003ca class=\"step\" href=\"#bayes\">\u003cspan class=\"num\">3\u003c/span>\u003cspan>\u003cb>Explorer les données\u003c/b>\u003csmall>Comprendre Bayes\u003c/small>\u003c/span>\u003c/a>\u003ca class=\"step\" href=\"#builder\">\u003cspan class=\"num\">4\u003c/span>\u003cspan>\u003cb>Créer un cas\u003c/b>\u003csmall>Préparer un exercice\u003c/small>\u003c/span>\u003c/a>\u003c/nav>\n\u003cdiv class=\"herofoot\">\u003cspan>Bienvenue ! Commencez par l’exemple synthétique 001 ; aucune installation requise.\u003c/span>\u003cspan class=\"gate\">🔒 Gate 2 clinique : BLOCK\u003c/span>\u003c/div>\u003c/div>\u003c/section>\n\u003cmain>\u003cdiv class=\"wrap board\">\n\u003csection class=\"card\" id=\"cases\">\u003cdiv class=\"head\">A · SÉLECTEUR DE CAS \u003cspan class=\"badge\">100 % fictif\u003c/span>\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"pick\">Choisir un exemple pédagogique\u003c/label>\u003cselect id=\"pick\">\u003c/select>\u003c/div>\n\u003cdiv class=\"grid2\">\u003cdiv class=\"tile\">\u003cb>Code fictif\u003c/b>\u003cstrong id=\"code\">—\u003c/strong>\u003c/div>\u003cdiv class=\"tile\">\u003cb>Contexte\u003c/b>\u003cstrong id=\"context\">—\u003c/strong>\u003c/div>\u003cdiv class=\"tile\">\u003cb>Prélèvement\u003c/b>\u003cstrong id=\"sample-label\">—\u003c/strong>\u003c/div>\u003cdiv class=\"tile\">\u003cb>Valeur simulée\u003c/b>\u003cstrong id=\"reading\">—\u003c/strong>\u003c/div>\u003c/div>\n\u003cdiv class=\"pillrow\">\u003cspan>① Entrée\u003c/span>\u003cspan>② Métadonnées\u003c/span>\u003cspan>③ Contrôle\u003c/span>\u003cspan>④ Gate 1\u003c/span>\u003cspan>⑤ Gate 2 BLOCK\u003c/span>\u003c/div>\n\u003cdiv class=\"actions\">\u003cbutton class=\"btn light\" id=\"next\">Charger un autre cas ↻\u003c/button>\u003cbutton class=\"btn light\" id=\"glitch\">Spot the Glitch · Injecter un défaut\u003c/button>\u003c/div>\n\u003c/section>\n\u003csection class=\"card\" id=\"admission\">\u003cdiv class=\"head\">B · MÉTADONNÉES & GATE 1 \u003cspan class=\"badge\">Documentaire\u003c/span>\u003c/div>\n\u003cdiv class=\"grid2\">\u003cdiv>\u003cdiv class=\"field\">\u003clabel for=\"analyte\">Paramètre fictif\u003c/label>\u003cinput id=\"analyte\" maxlength=\"70\">\u003c/div>\n\u003cdiv class=\"grid2\">\u003cdiv class=\"field\">\u003clabel for=\"value\">Valeur\u003c/label>\u003cinput id=\"value\" type=\"number\" step=\"any\">\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"unit\">Unité commune\u003c/label>\u003cinput id=\"unit\" maxlength=\"30\">\u003c/div>\u003c/div>\n\u003cdiv class=\"grid2\">\u003cdiv class=\"field\">\u003clabel for=\"low\">Borne basse\u003c/label>\u003cinput id=\"low\" type=\"number\" step=\"any\">\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"high\">Borne haute\u003c/label>\u003cinput id=\"high\" type=\"number\" step=\"any\">\u003c/div>\u003c/div>\n\u003cdiv class=\"field\">\u003clabel for=\"source\">Source/version de référence\u003c/label>\u003cinput id=\"source\" maxlength=\"100\">\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"method\">Méthode fictive\u003c/label>\u003cinput id=\"method\" maxlength=\"70\">\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"sample\">Type de prélèvement\u003c/label>\u003cinput id=\"sample\" maxlength=\"70\">\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"population\">Population de référence fictive\u003c/label>\u003cinput id=\"population\" maxlength=\"70\">\u003c/div>\u003c/div>\n\u003cdiv>\u003cdiv class=\"grid3\">\u003cdiv class=\"field\">\u003clabel for=\"identity\">Identité\u003c/label>\u003cselect id=\"identity\">\u003coption value=\"yes\">Vérifiée\u003c/option>\u003coption value=\"no\">Non conforme\u003c/option>\u003coption value=\"unknown\">Inconnue\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"quality\">Qualité\u003c/label>\u003cselect id=\"quality\">\u003coption value=\"yes\">Conforme\u003c/option>\u003coption value=\"no\">Non conforme\u003c/option>\u003coption value=\"unknown\">Inconnue\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"interference\">Interférence\u003c/label>\u003cselect id=\"interference\">\u003coption value=\"no\">Absente\u003c/option>\u003coption value=\"yes\">Suspectée\u003c/option>\u003coption value=\"unknown\">Inconnue\u003c/option>\u003c/select>\u003c/div>\u003c/div>\n\u003cdiv class=\"checks\" id=\"checks\">\u003c/div>\u003cdiv class=\"actions\">\u003cbutton class=\"btn gold\" id=\"verify\">Contrôler la preuve →\u003c/button>\u003c/div>\u003cdiv class=\"status\" id=\"result\" role=\"status\" aria-live=\"polite\">Gate 1 à contrôler · Gate 2 BLOCK\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>\n\u003csection class=\"card\" id=\"consequences\">\u003cdiv class=\"head\">C · CONSÉQUENCES FICTIVES \u003cspan class=\"badge warn\">Hypothèse, non prédiction\u003c/span>\u003c/div>\n\u003cdiv class=\"notice\" id=\"consequence\">\u003cstrong>Exercice contrefactuel\u003c/strong>\u003cp>Analyse de risques documentaires, sans prédiction clinique ni coût réel.\u003c/p>\u003c/div>\u003cdiv class=\"grid2\" style=\"margin-top:10px\">\u003cdiv class=\"stat\">\u003csmall>Conséquence pédagogique potentielle\u003c/small>\u003cb id=\"risk\">—\u003c/b>\u003c/div>\u003cdiv class=\"stat\">\u003csmall>Coût fictif d’une reprise\u003c/small>\u003cb id=\"cost\">0 €\u003c/b>\u003c/div>\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"price\">Hypothèse par reprise : \u003coutput id=\"price-label\">75 €\u003c/output>\u003c/label>\u003cinput id=\"price\" type=\"range\" min=\"0\" max=\"500\" step=\"5\" value=\"75\">\u003c/div>\u003cp class=\"hint\">Le montant est choisi arbitrairement. Aucune estimation de coûts, de lésion ou de traitement réel.\u003c/p>\u003c/section>\n\u003csection class=\"card\" id=\"bayes\">\u003cdiv class=\"head\">D · BAYES & VISUALISATION \u003cspan class=\"badge\">1000 observations fictives\u003c/span>\u003c/div>\n\u003cdiv class=\"grid2\">\u003cdiv>\u003cdiv class=\"slider\">\u003clabel for=\"se\">Sensibilité\u003c/label>\u003coutput id=\"se-o\">95 %\u003c/output>\u003cinput id=\"se\" type=\"range\" min=\"1\" max=\"100\" value=\"95\">\u003c/div>\u003cdiv class=\"slider\">\u003clabel for=\"sp\">Spécificité\u003c/label>\u003coutput id=\"sp-o\">98 %\u003c/output>\u003cinput id=\"sp\" type=\"range\" min=\"1\" max=\"100\" value=\"98\">\u003c/div>\u003cdiv class=\"slider\">\u003clabel for=\"prev\">Prévalence d’exercice\u003c/label>\u003coutput id=\"prev-o\">1 %\u003c/output>\u003cinput id=\"prev\" type=\"range\" min=\"1\" max=\"99\" value=\"1\">\u003c/div>\n\u003cdiv class=\"grid2\">\u003cdiv class=\"tile\">\u003cb>VPP\u003c/b>\u003cstrong id=\"ppv\">—\u003c/strong>\u003c/div>\u003cdiv class=\"tile\">\u003cb>VPN\u003c/b>\u003cstrong id=\"npv\">—\u003c/strong>\u003c/div>\u003c/div>\u003c/div>\u003cdiv>\u003csvg class=\"chart\" id=\"bayes-chart\" viewBox=\"0 0 420 110\" role=\"img\" aria-label=\"Probabilité prétest et post-test positive\">\u003c/svg>\u003cp class=\"hint\">Visualisation simplifiée du rapport prétest / post-test, non nomogramme clinique validé.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"waffle\" id=\"waffle\" role=\"img\">\u003c/div>\u003cdiv class=\"legend\" id=\"legend\">\u003c/div>\n\u003c/section>\n\u003csection class=\"card\" id=\"builder\">\u003cdiv class=\"head\">E · CASE BUILDER & EXAMEN\u003c/div>\u003cp class=\"small\">Créez une erreur documentaire sur un cas entièrement inventé. Aucun cas patient, même anonymisé, n’est accepté.\u003c/p>\n\u003cdiv class=\"field\">\u003clabel for=\"fault\">Erreur à simuler\u003c/label>\u003cselect id=\"fault\">\u003coption value=\"source\">Source absente\u003c/option>\u003coption value=\"method\">Méthode absente\u003c/option>\u003coption value=\"quality\">Contrôle qualité défaillant\u003c/option>\u003coption value=\"identity\">Discordance de prélèvement\u003c/option>\u003coption value=\"interference\">Interférence suspectée\u003c/option>\u003coption value=\"range\">Bornes incohérentes\u003c/option>\u003coption value=\"unit\">Unité manquante\u003c/option>\u003c/select>\u003c/div>\n\u003cdiv class=\"actions\">\u003cbutton class=\"btn gold\" id=\"create\">+ Ajouter un cas\u003c/button>\u003cbutton class=\"btn light\" id=\"exam-start\">Mode examen\u003c/button>\u003c/div>\u003cdiv class=\"status\" id=\"case-status\">Prêt pour un exercice.\u003c/div>\n\u003cdiv class=\"hidden\" id=\"exam\" style=\"margin-top:10px\">\u003clabel for=\"exam-choice\">Choisir la réponse Gate 1 (corrigé masqué)\u003c/label>\u003cselect id=\"exam-choice\">\u003coption value=\"\">Votre réponse\u003c/option>\u003coption>ALLOW\u003c/option>\u003coption>DELAY\u003c/option>\u003coption>BLOCK\u003c/option>\u003coption>UNKNOWN\u003c/option>\u003c/select>\u003cbutton class=\"btn\" id=\"exam-check\">Vérifier\u003c/button>\u003cdiv class=\"status\" id=\"exam-feedback\">Corrigé masqué.\u003c/div>\u003c/div>\n\u003c/section>\n\u003csection class=\"card\" id=\"import\">\u003cdiv class=\"head\">F · IMPORT SYNTHÉTIQUE CSV / FHIR / HL7\u003c/div>\u003clabel class=\"drop\" for=\"file\">\u003cspan>⬆ Déposez ou sélectionnez un fichier d’exercice\u003cbr>\u003csmall>.csv · .json · .hl7 · 100 Ko maximum\u003c/small>\u003c/span>\u003cinput id=\"file\" type=\"file\" accept=\".csv,.json,.hl7,text/csv,application/json,text/plain\">\u003c/label>\n\u003cdiv class=\"actions\">\u003cbutton class=\"btn light\" id=\"demo-fhir\">Importer exemple FHIR\u003c/button>\u003cbutton class=\"btn light\" id=\"demo-hl7\">Importer exemple HL7\u003c/button>\u003c/div>\u003cdiv class=\"status\" id=\"import-status\" role=\"status\">Formats limités aux exercices. Aucun import de patients.\u003c/div>\u003cp class=\"hint\">Ce n’est ni un parseur HL7/FHIR général ni un système d’anonymisation. Marqueur SYN et données strictement inventées requis.\u003c/p>\u003c/section>\n\u003csection class=\"card wide\" id=\"role\">\u003cdiv class=\"head\">G · MODE COLLABORATIF — DEUX RÔLES \u003cspan class=\"badge\">Un appareil · exercice\u003c/span>\u003c/div>\u003cdiv class=\"grid2\">\u003cdiv class=\"role\">\u003cb>🧪 Rôle laboratoire\u003c/b>\u003cp>Observer et signaler les écarts documentaires.\u003c/p>\u003cbutton class=\"btn light\" id=\"lab\">Envoyer un signalement fictif\u003c/button>\u003c/div>\u003cdiv class=\"role\">\u003cb>🩺 Rôle clinicien\u003c/b>\u003cp>Accuser réception et demander des compléments.\u003c/p>\u003cbutton class=\"btn light\" id=\"doctor\" disabled>Demander clarification\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"status\" id=\"role-status\">Aucun échange. Il ne s’agit pas d’une communication réelle.\u003c/div>\u003c/section>\n\u003csection class=\"card wide\" id=\"audit\">\u003cdiv class=\"head\">H · TRAÇABILITÉ & EXPORT \u003cspan class=\"badge\">Glassbox / A7SEM Reverse\u003c/span>\u003c/div>\u003cdiv class=\"grid3\">\u003cdiv class=\"stat\">\u003cb id=\"audit-count\">0\u003c/b>\u003csmall>Événements locaux\u003c/small>\u003c/div>\u003cdiv class=\"stat\">\u003cb id=\"total-cases\">3\u003c/b>\u003csmall>Cas synthétiques en mémoire\u003c/small>\u003c/div>\u003cdiv class=\"stat\">\u003cb>BLOCK\u003c/b>\u003csmall>Gate 2 clinique permanent\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"pillrow\" id=\"events\">\u003c/div>\u003cdiv class=\"actions\">\u003cbutton class=\"btn\" id=\"json\">Exporter JSON\u003c/button>\u003cbutton class=\"btn light\" id=\"csv\">Exporter CSV\u003c/button>\u003cbutton class=\"btn light\" id=\"reset\">Réinitialiser\u003c/button>\u003ca class=\"btn light\" href=\"workbench.html\">QM Workbench →\u003c/a>\u003c/div>\u003cp class=\"hint\">Session volatile. Les fichiers exportés ne sont ni signés ni horodatés par un tiers.\u003c/p>\u003c/section>\n\u003c/div>\u003c/main>\u003cdiv class=\"stop\">🔒 GATE 2 : ACTION CLINIQUE TOUJOURS BLOQUÉE — VERSION DE FORMATION, CAS FICTIFS EXCLUSIVEMENT.\u003c/div>\u003cfooter class=\"footer\">\u003cdiv class=\"wrap\">© 2026 Mounir Akarkach · \u003ca href=\"index.html\">Livre\u003c/a> · \u003ca href=\"app.html\">LA PREUVE LAB\u003c/a> · \u003ca href=\"workbench.html\">Workbench\u003c/a> · \u003ca href=\"evaluation.html\">Étude\u003c/a> · \u003ca href=\"licence.html\">Licence\u003c/a> · \u003ca href=\"confidentialite.html\">Confidentialité\u003c/a>. ADOS — Akarkach Diagnostic Operating System : programme de psychologie distinct.\u003c/div>\u003c/footer>\n\u003cscript>\n(function(){\"use strict\";\nconst $=id=>document.getElementById(id),base=(id,changes={})=>({id,analyte:\"ANALYTE_FICTIF\",value:\"140\",low:\"120\",high:\"160\",unit:\"U_fictive\",source:\"Reference_fictive_v1\",method:\"Automate_fictif\",sample:\"Prélèvement_fictif\",population:\"Population_fictive\",identity:\"yes\",quality:\"yes\",interference:\"no\",context:\"Contrôle documentaire\",...changes});\nconst initial=[base(\"SYN-DEMO-001\"),base(\"SYN-DEMO-002\",{context:\"Interférence déclarée\",interference:\"yes\",value:\"171\"}),base(\"SYN-DEMO-003\",{context:\"Source manquante\",source:\"\"})];\nlet cases=initial.map(x=>({...x})),current=0,events=[],seq=0,roleStage=0;\nconst esc=s=>String(s??\"\").replace(/[&\u003c>\"']/g,c=>({\"&\":\"&amp;\",\"\u003c\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\",\"'\":\"&#39;\"}[c]));\nfunction classify(x){let issues=[],v=String(x.value??\"\").trim()===\"\"?NaN:Number(x.value),lo=String(x.low??\"\").trim()===\"\"?NaN:Number(x.low),hi=String(x.high??\"\").trim()===\"\"?NaN:Number(x.high);\nif(x.identity===\"no\")issues.push(\"Identité non conforme\");\nif(x.quality===\"no\")issues.push(\"Contrôle qualité non conforme\");\nif(x.interference===\"yes\")issues.push(\"Interférence suspectée\");\nlet blocked=issues.length>0,invalid=![v,lo,hi].every(Number.isFinite)||lo>=hi;\nif(invalid)issues.push(\"Valeur / bornes incohérentes\");\nlet missing=[\"analyte\",\"unit\",\"source\",\"method\",\"sample\",\"population\"].filter(k=>!String(x[k]??\"\").trim());\nif(missing.length)issues.push(\"Métadonnées manquantes : \"+missing.join(\", \"));\nlet unknown=[\"identity\",\"quality\",\"interference\"].filter(k=>![\"yes\",\"no\",\"unknown\"].includes(x[k])||x[k]===\"unknown\");\nif(unknown.length)issues.push(\"Contrôle inconnu : \"+unknown.join(\", \"));\nreturn {gate1:blocked?\"BLOCK\":invalid?\"UNKNOWN\":missing.length||unknown.length?\"DELAY\":\"ALLOW\",gate2:\"BLOCK\",issues:issues.length?issues:[\"Documentation présente\"],relation:invalid?\"Non calculable\":v\u003clo?\"Sous intervalle\":v>hi?\"Au-dessus intervalle\":\"Dans intervalle\"};}\nconst keys=[\"analyte\",\"value\",\"low\",\"high\",\"unit\",\"source\",\"method\",\"sample\",\"population\",\"identity\",\"quality\",\"interference\"];\nfunction currentData(){const x={...cases[current]};for(const k of keys)x[k]=$(k).value;return x}\nfunction audit(type,detail){events.push({seq:++seq,type,case:cases[current].id,detail:String(detail).slice(0,180),gate2:\"BLOCK\"});if(events.length>150)events.shift();refresh()}\nfunction refresh(){$(\"audit-count\").textContent=events.length;$(\"total-cases\").textContent=cases.length;$(\"events\").innerHTML=events.slice(-9).map(e=>\"\u003cspan>\"+esc(e.seq+\" · \"+e.type+\" · \"+e.detail)+\"\u003c/span>\").join(\"\")}\nfunction checklist(x){const list=[[\"Identité\",x.identity===\"yes\"],[\"Qualité\",x.quality===\"yes\"],[\"Interférence\",x.interference===\"no\"],[\"Source\",!!x.source],[\"Méthode\",!!x.method],[\"Unité / population\",!!x.unit&&!!x.population]];\n$(\"checks\").innerHTML=list.map(([t,ok])=>'\u003cdiv class=\"check'+(ok?\"\":\" bad\")+'\">'+(ok?\"✓ \":\"! \")+esc(t)+\"\u003c/div>\").join(\"\")}\nfunction consequence(r){const bad=r.gate1!==\"ALLOW\",price=Number($(\"price\").value);$(\"price-label\").textContent=price+\" €\";$(\"risk\").textContent=bad?\"Vérification supplémentaire\":\"Aucune anomalie déclarée\";$(\"cost\").textContent=bad?price+\" €\":\"0 €\";\n$(\"consequence\").innerHTML=bad?\"\u003cstrong>Exercice contrefactuel\u003c/strong>\u003cp>Si la condition « \"+esc(r.issues[0])+\" » était ignorée, une mauvaise interprétation serait possible. Une reprise documentaire pourrait être nécessaire. Aucun dommage médical réel n’est prédit.\u003c/p>\":\"\u003cstrong>Documentation présente\u003c/strong>\u003cp>Cette condition permet seulement une comparaison arithmétique fictive. Elle ne garantit aucune décision médicale.\u003c/p>\"}\nfunction show(){const x=cases[current];$(\"pick\").innerHTML=cases.map((c,i)=>'\u003coption value=\"'+i+'\">'+esc(c.id+\" · \"+c.context)+\"\u003c/option>\").join(\"\");$(\"pick\").value=current;for(const k of keys)$(k).value=x[k];$(\"code\").textContent=x.id;$(\"context\").textContent=x.context;$(\"sample-label\").textContent=x.sample||\"Manquant\";$(\"reading\").textContent=x.value+\" \"+x.unit;$(\"result\").textContent=\"Contrôle requis · Gate 2 BLOCK\";$(\"result\").className=\"status\";checklist(x);consequence(classify(x));refresh()}\nfunction verify(){const x=currentData(),r=classify(x);checklist(x);consequence(r);$(\"result\").className=\"status\"+(r.gate1===\"ALLOW\"?\"\":\" bad\");$(\"result\").innerHTML=\"\u003cb>Gate 1 : \"+r.gate1+\"\u003c/b> · \"+esc(r.relation)+\"\u003cbr>\"+esc(r.issues.join(\" · \"))+\"\u003cbr>\u003cb>Gate 2 : BLOCK\u003c/b>\";audit(\"GATE1\",r.gate1+\" · \"+r.issues[0]);return r}\nlet dotNodes=[];function bayes(){let se=Number($(\"se\").value)/100,sp=Number($(\"sp\").value)/100,p=Number($(\"prev\").value)/100;\nfor(const [k,n] of [[\"se\",se],[\"sp\",sp],[\"prev\",p]])$(k+\"-o\").textContent=Math.round(n*100)+\" %\";\nlet vals=[1000*p*se,1000*(1-p)*(1-sp),1000*(1-p)*sp,1000*p*(1-se)],total=vals.map(Math.floor),rems=vals.map((n,i)=>({i,r:n-Math.floor(n)})).sort((a,b)=>b.r-a.r);\nfor(let k=1000-total.reduce((a,b)=>a+b,0),i=0;i\u003ck;i++)total[rems[i].i]++;\nlet ppv=vals[0]/(vals[0]+vals[1]),npv=vals[2]/(vals[2]+vals[3]);$(\"ppv\").textContent=(ppv*100).toFixed(1)+\" %\";$(\"npv\").textContent=(npv*100).toFixed(1)+\" %\";\nif(!dotNodes.length){let fragment=document.createDocumentFragment();for(let i=0;i\u003c1000;i++){let dot=document.createElement(\"span\");dot.className=\"dot\";dotNodes.push(dot);fragment.appendChild(dot)}$(\"waffle\").replaceChildren(fragment);}let offset=0,types=[\"tp\",\"fp\",\"tn\",\"fn\"];total.forEach((n,j)=>{for(let i=0;i\u003cn;i++)dotNodes[offset++].className=\"dot \"+types[j]});\nlet labels=[\"Vrais positifs\",\"Faux positifs\",\"Vrais négatifs\",\"Faux négatifs\"],colors=[\"#1a9376\",\"#e36956\",\"#217ab7\",\"#8d9ca6\"];\n$(\"legend\").innerHTML=total.map((n,i)=>'\u003cspan>\u003ci style=\"background:'+colors[i]+'\">\u003c/i>'+labels[i]+' : '+n+\"\u003c/span>\").join(\"\");$(\"waffle\").setAttribute(\"aria-label\",total.map((n,i)=>labels[i]+\" \"+n).join(\", \"));\nlet x1=30+p*360,x2=30+ppv*360;$(\"bayes-chart\").innerHTML='\u003cline x1=\"30\" y1=\"69\" x2=\"390\" y2=\"69\" stroke=\"#a0c0b8\" stroke-width=\"5\"/>\u003cpath d=\"M'+x1+' 35 L'+x2+' 35\" stroke=\"#d6a963\" stroke-width=\"5\"/>\u003ccircle cx=\"'+x1+'\" cy=\"35\" r=\"6\" fill=\"#1578a5\"/>\u003ccircle cx=\"'+x2+'\" cy=\"35\" r=\"6\" fill=\"#cc9854\"/>\u003ctext x=\"30\" y=\"17\" font-size=\"11\">Prétest '+Math.round(p*100)+' %\u003c/text>\u003ctext x=\"220\" y=\"17\" font-size=\"11\">Post-test + '+(ppv*100).toFixed(1)+' %\u003c/text>\u003ctext x=\"30\" y=\"94\" font-size=\"11\">0 %\u003c/text>\u003ctext x=\"368\" y=\"94\" font-size=\"11\">100 %\u003c/text>'}\nfunction addFault(x,f){if(f===\"source\")x.source=\"\";if(f===\"method\")x.method=\"\";if(f===\"identity\")x.identity=\"no\";if(f===\"quality\")x.quality=\"no\";if(f===\"interference\")x.interference=\"yes\";if(f===\"range\")x.high=\"100\";if(f===\"unit\")x.unit=\"\";return x}\nfunction addCase(f){if(cases.length>=30)throw Error(\"Maximum 30 cas fictifs.\");const x=addFault(base(\"SYN-CASE-\"+String(cases.length+1).padStart(3,\"0\"),{context:\"Exercice personnalisé\"}),f);cases.push(x);current=cases.length-1;show();audit(\"CASE_CREATED\",f)}\nfunction parseImport(name,content){if(content.length>100000)throw Error(\"Fichier trop volumineux\");let ext=name.toLowerCase().split(\".\").at(-1),records=[];\nif(ext===\"json\"){const x=JSON.parse(content);if(!x||Object.keys(x).some(k=>![\"resourceType\",\"meta\",\"entry\"].includes(k))||Object.keys(x.meta||{}).some(k=>k!==\"tag\")||x.resourceType!==\"Bundle\"||!Array.isArray(x.meta?.tag)||!x.meta.tag.some(t=>t&&t.code===\"SYNTHETIC-ONLY\"&&Object.keys(t).every(k=>k===\"code\"))||!Array.isArray(x.entry)||!x.entry.length||x.entry.length>20)throw Error(\"Bundle marqué SYNTHETIC-ONLY obligatoire.\");\nfor(const e of x.entry){const o=e.resource;if(Object.keys(e).some(k=>k!==\"resource\")||!o||Object.keys(o).some(k=>![\"resourceType\",\"id\",\"valueQuantity\",\"referenceRange\"].includes(k)))throw Error(\"Champs FHIR non autorisés : seuls des exercices sans identité sont admis.\");if(o?.resourceType!==\"Observation\"||!/^SYN-[\\w-]+$/.test(o.id||\"\")||o.subject||o.performer||o.effectiveDateTime||o.issued)throw Error(\"Patient ou identifiant non fictif interdit to}*,*:before,*:after{transition:none!important;animation:none!important}}\n@media print{.ak-skip,.ak-mast,.ak-header,.ak-welcome{display:none!important}}\n\n\n/* AKARKACH / LA PREUVE LAB · Edition 2026.10.24 V4\n   Editorial precision × calm scientific workbench. No remote fonts, assets or tracking. */\n:root{--ak-cream:#f8f4ec;--ak-midnight:#061d2a;--ak-ice:#d9efeb;--ak-gold2:#dfba77;--ak-curve:cubic-bezier(.2,.7,.2,1)}\nbody.ak-v4{font-kerning:normal;font-feature-settings:\"kern\",\"liga\";accent-color:#b89560}\n.ak-v4 .ak-mast{background:#071924;border-bottom:1px solid #ffffff12}\n.ak-v4 .ak-author{font-size:clamp(13px,1.7vw,16px);letter-spacing:.14em;line-height:1.35}\n.ak-v4 .ak-header{background:#0a2632ee!important;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}\n.ak-v4 .ak-mark{letter-spacing:.115em}\n.ak-v4 .ak-mark-icon{background:linear-gradient(145deg,#4c5c5a55,#10283588);border-color:#eacb9680;box-shadow:inset 0 1px 0 #ffffff18}\n.ak-v4 .ak-links a{border:1px solid transparent;transition:background .16s ease,border-color .16s ease,color .16s ease}\n.ak-v4 .ak-links a[aria-current=\"page\"]{border-color:#668787aa;box-shadow:inset 0 -2px 0 #e6c68e}\n.ak-v4 .ak-welcome{margin-top:22px}\n.ak-v4 .ak-welcome-body{padding:clamp(22px,3vw,38px);background:radial-gradient(circle at 90% -30%,#256c7088,transparent 47%),linear-gradient(116deg,#102e3b 0%,#061e2a 62%,#0c3942 100%);box-shadow:0 22px 70px #021c2a2b;border-color:#76948c58;border-radius:22px}\n.ak-v4 .ak-welcome-body:before{width:320px;height:320px;top:-160px;right:-80px;opacity:.5}\n.ak-v4 .ak-welcome-body:after{width:470px;height:470px;top:-240px;right:-200px;opacity:.48}\n.ak-v4 .ak-welcome h2{font-size:clamp(26px,4.4vw,42px);line-height:1.14;max-width:750px;letter-spacing:-.037em}\n.ak-v4 .ak-welcome p{font-size:clamp(13px,1.5vw,15px);max-width:800px;line-height:1.7}\n.ak-v4 .ak-eyebrow{letter-spacing:.18em;word-spacing:.1em}\n.ak-v4 .ak-guide-step{min-width:0;background:#ffffff0b;borde ver,.ak-v4 .ak-action:hover,.ak-v4 :where(.card,.v2card):hover{transform:none}}\n\n\u003c/style>\u003c/head>\n\u003cbody class=\"ak-v4 ak-study\">\u003ca class=\"ak-skip\" href=\"#ak-main\">Aller au contenu principal\u003c/a>\n\u003cdiv class=\"ak-mast\">\u003cdiv class=\"ak-wrap\">\u003cdiv>\u003cstrong class=\"ak-author\">MOUNIR AKARKACH\u003c/strong> \u003cspan class=\"ak-author-sub\">· Auteur & chercheur indépendant · PIGA / A7SEM\u003c/span>\u003c/div>\u003cdiv class=\"ak-mast-right\">\u003cspan>Autre programme en psychologie :\u003c/span>\u003ca href=\"https://pigapocket.com/ados/\">ADOS — Akarkach Diagnostic Operating System\u003c/a>\u003cspan class=\"ak-small\">(distinct de ce laboratoire)\u003c/span>\u003c/div>\u003c/div>\u003c/div>\n\u003cheader class=\"ak-header\">\u003cdiv class=\"ak-bar\">\u003ca class=\"ak-mark\" href=\"index.html\">\u003cspan class=\"ak-mark-icon\" aria-hidden=\"true\">✦\u003c/span> LA PREUVE \u003cem>LAB\u003c/em>\u003c/a>\u003cnav class=\"ak-links\" aria-label=\"Navigation principale\">\u003ca href=\"index.html\">Livre\u003c/a>\u003ca href=\"app.html\">LA PREUVE LAB\u003c/a>\u003ca href=\"workbench.html\">QM Workbench\u003c/a>\u003ca href=\"studio.html\">Studio interactif\u003c/a>\u003ca href=\"evaluation.html\" aria-current=\"page\">Étude pilote\u003c/a>\u003c/nav>\u003c/div>\u003c/header>\u003csection class=\"ak-welcome\" aria-labelledby=\"ak-title\">\u003cdiv class=\"ak-welcome-body\">\u003cspan class=\"ak-eyebrow\">Mounir Akarkach · La preuve avant le diagnostic · Recherche 2026\u003c/span>\u003ch2 id=\"ak-title\">Bienvenue dans l'étude pédagogique.\u003c/h2>\u003cdiv class=\"ak-accent-line\">\u003c/div>\u003cp>Cette simulation compare 12 décisions manuelles et 12 décisions assistées. Les réponses correctes restent masquées jusqu'à la fin des 24 cas.\u003c/p>\u003cdiv class=\"ak-guide\" aria-label=\"Guide de démarrage\">\u003ca class=\"ak-guide-step\" href=\"#start\">\u003cspan class=\"ak-num\" aria-hidden=\"true\">1\u003c/span>\u003cspan>\u003cb>Lire les règles\u003c/b>\u003csmall>Prendre connaissance du protocole fictif.\u003c/small>\u003c/span>\u003c/a>\u003ca class=\"ak-guide-step\" href=\"#start\">\u003cspan class=\"ak-num\" aria-hidden=\"true\">2\u003c/span>\u003cspan>\u003cb>Réaliser 24 cas\u003c/b>\u003csmall>Suivre les consignes de chaque série.\u003c/small>\u003c/span>\u003c/a>\u003ca class=\"ak-guide-step\" href=\"#start\">\u003cspan class=\"ak-num\" aria-hidden=\"true\">3\u003c/span>\u003cspan>\u003cb>Lire et exporter\u003c/b>\u003csmall>Comparer les temps et les statuts.\u003c/small>\u003c/span>\u003c/a>\u003c/div>\u003cdiv class=\"ak-guide-foot\">\u003ca class=\"ak-action\" href=\"#start\">Lire les consignes de l'étude →\u003c/a>\u003cdetails class=\"ak-details\">\u003csummary>Guide d'utilisation et limites\u003c/summary>\u003cp>Il ne s'agit ni d'une étude clinique ni d'une validation auprès de personnel de laboratoire réel. \u003ca href=\"index.html\">Comprendre le livre\u003c/a> · \u003ca href=\"workbench.html\">Explorer les règles QM\u003c/a> · \u003ca href=\"app.html\">Ouvrir la simulation.\u003c/a>\u003c/p>\u003c/details>\u003cspan class=\"ak-purpose\">Gate 2 clinique : BLOCK\u003c/span>\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"hero\">\u003cdiv class=\"wrap\">\u003cdiv class=\"eyebrow\">Protocole de recherche · Version pilote 1.0\u003c/div>\u003ch1>Évaluation comparative\u003cbr>de la qualité documentaire\u003c/h1>\n\u003cp class=\"lead\">Une étude préparatoire à deux conditions : contrôle documentaire manuel et contrôle assisté par LA PREUVE LAB, avec 24 cas exclusivement inventés. Aucun diagnostic, aucune donnée patient.\u003c/p>\u003c/div>\u003c/section>\n\u003cmain id=\"ak-main\" class=\"wrap\">\n\u003cdiv class=\"panel\" id=\"start\">\u003ch2>Avant de commencer\u003c/h2>\n\u003cdiv class=\"notice\">\u003cb>Recherche pédagogique, exclusivement fictive.\u003c/b> Cette page ne reçoit et n'envoie aucune donnée à un serveur. Les résultats sont en mémoire temporaire dans votre navigateur, puis exportables localement en JSON ou CSV. Ne saisissez ni nom, ni donnée de patient, ni identifiant professionnel.\u003c/div>\n\u003cp>Le protocole comprend \u003cb>24 cas\u003c/b>, répartis en deux séries de 12. L'ordre des conditions est tiré aléatoirement : manuel → assisté ou assisté → manuel. Les deux séries comportent les mêmes douze catégories de situations, avec des valeurs fictives différentes.\u003c/p>\n\u003cul>\u003cli>\u003cb>Manuel :\u003c/b> lire les critères documentaires et attribuer un statut par vous-même, sans consulter l'application.\u003c/li>\n\u003cli>\u003cb>Assisté :\u003c/b> ouvrir l'application, saisir toutes les données du cas fictif et reporter le statut de Gate 1. L'utilisation du logiciel et le changement d'onglet font partie du temps mesuré.\u003c/li>\n\u003cli>\u003cb>Mesures :\u003c/b> temps par cas (en secondes), statut correct selon les règles annoncées, ALLOW incorrects, cas bloqués/retardés, différences entre conditions.\u003c/li>\n\u003cli>\u003cb>Intégrité :\u003c/b> les bonnes réponses ne sont révélées qu'une fois les 24 cas terminés. Les résultats ne sont pas conservés après actualisation ou fermeture.\u003c/li>\u003c/ul>\n\u003cdiv class=\"helper\">\u003cb>Règles d'admission documentaire (identiques aux fonctions démontrées par l'app) :\u003c/b>\u003cbr>\n\u003ccode>BLOCK\u003c/code> si identité ou qualité non conforme, ou interférence présente ; sinon \u003ccode>UNKNOWN\u003c/code> si valeur/borne non numérique ou intervalle invalide ; sinon \u003ccode>DELAY\u003c/code> si source, méthode, type de prélèvement, population, paramètre ou unité absent, ou qualité/identité/interférence non renseignée ; sinon \u003ccode>ALLOW\u003c/code> pour \u003cem>la comparaison documentaire uniquement\u003c/em> – même si la valeur fictive se situe hors de l'intervalle.\u003c/div>\n\u003cp class=\"fine muted\">La page documente une évaluation de règles, non une étude clinique. Aucun consentement ou protocole institutionnel n'est présumé. Le volontariat et les règles propres à votre établissement restent à apprécier séparément avant une étude formelle.\u003c/p>\n\u003clabel class=\"inlinecheck\">\u003cinput id=\"consent\" type=\"checkbox\">\u003cspan>Je confirme n'utiliser que des cas fictifs et comprends que ce test n'autorise aucune décision clinique.\u003c/span>\u003c/label>\n\u003cdiv class=\"controls\">\u003cbutton class=\"btn gold\" id=\"begin\" disabled>Commencer les 24 cas\u003c/button>\u003ca class=\"btn light\" href=\"app.html\" target=\"_blank\" rel=\"noopener noreferrer\">Se familiariser avec l'app ↗\u003c/a>\u003c/div>\u003c/div>\n\u003cdiv id=\"session\" class=\"hidden\">\n\u003cdiv class=\"panel\">\u003cdiv class=\"meta\">\u003cspan class=\"tag\" id=\"counter\">Cas 1 sur 24\u003c/span>\u003cspan class=\"tag\" id=\"condition\">Manuel\u003c/span>\u003cspan class=\"tag\">Gate 2 : BLOCK clinique\u003c/span>\u003c/div>\u003cdiv class=\"bar\">\u003ci id=\"progress\">\u003c/i>\u003c/div>\n\u003ch2 id=\"caseHeading\">Fiche de simulation\u003c/h2>\u003cp class=\"muted fine\" id=\"orderHint\">\u003c/p>\u003cdiv class=\"grid\" id=\"fields\">\u003c/div>\n\u003cdiv id=\"assistBox\" class=\"notice hidden\" style=\"margin-top:17px\">\u003cb>Condition assistée :\u003c/b> ouvrez LA PREUVE LAB dans un nouvel onglet et recopiez les données fictives affichées ici. Cliquez sur « Contrôler » dans l'application ; revenez ensuite pour enregistrer son statut Gate 1. \u003cb>N'utilisez aucune vraie donnée de laboratoire.\u003c/b>\u003cdiv class=\"controls\">\u003ca class=\"btn gold\" href=\"app.html\" target=\"_blank\" rel=\"noopener noreferrer\">Ouvrir l'app pour vérifier ↗\u003c/a>\u003c/div>\u003c/div>\n\u003cdiv id=\"manualBox\" class=\"helper hidden\" style=\"margin-top:17px\">Condition manuelle : attribuez le statut documenté selon les règles affichées au départ. \u003cb>Ne consultez pas l'application pendant cette série.\u003c/b>\u003c/div>\n\u003ch3>Quel statut documentaire Gate 1 retenez-vous ?\u003c/h3>\n\u003cdiv class=\"choice\" role=\"radiogroup\" aria-label=\"Statut de Gate 1\">\n\u003clabel>\u003cinput type=\"radio\" name=\"decision\" value=\"ALLOW\">ALLOW\u003c/label>\n\u003clabel>\u003cinput type=\"radio\" name=\"decision\" value=\"DELAY\">DELAY\u003c/label>\n\u003clabel>\u003cinput type=\"radio\" name=\"decision\" value=\"BLOCK\">BLOCK\u003c/label>\n\u003clabel>\u003cinput type=\"radio\" name=\"decision\" value=\"UNKNOWN\">UNKNOWN\u003c/label>\n\u003c/div>\u003cdiv class=\"controls\">\u003cbutton class=\"btn gold\" id=\"submitCase\" disabled>Enregistrer et passer au suivant →\u003c/button>\u003c/div>\n\u003cp class=\"fine muted\">Chronomètre continu pendant ce cas, y compris le passage dans l'autre onglet. Aucun résultat envoyé sur le réseau.\u003c/p>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"panel hidden\" id=\"finish\">\u003ch2>Analyse de session · 24 cas fictifs\u003c/h2>\u003cp class=\"muted\">Les résultats sont descriptifs et ne prouvent ni efficacité clinique ni gain de temps généralisable.\u003c/p>\n\u003cdiv class=\"grid\" id=\"summary\">\u003c/div>\u003cdiv id=\"report\">\u003c/div>\n\u003cdiv class=\"controls\">\u003cbutton class=\"btn gold\" id=\"exportJson\">Exporter JSON\u003c/button>\u003cbutton class=\"btn light\" id=\"exportCsv\">Exporter CSV\u003c/button>\u003cbutton class=\"btn light\" id=\"print\">Imprimer\u003c/button>\u003cbutton class=\"btn light\" id=\"clear\">Effacer la session\u003c/button>\u003c/div>\n\u003cp class=\"notice\">\u003cb>Gate 1 – conclusion :\u003c/b> comparaison d'une seule session simulée, descriptive. Les effets d'apprentissage, d'ordre, de temps de saisie et d'expérience ne sont pas éliminés par ce dispositif. \u003cb>Gate 2 : BLOCK\u003c/b> pour toute utilisation clinique. Pour une étude inter-équipes, il faut des évaluateurs humains indépendants, des critères préenregistrés, une analyse statistique et une gouvernance de la collecte des données.\u003c/p>\n\u003c/div>\u003c/main>\u003cfooter class=\"footer\">\u003cdiv class=\"wrap\">© 2026 Mounir Akarkach · PIGA / A7SEM Reverse · Expérimentation documentaire avec données fictives uniquement. \u003ca href=\"licence.html\">Licence\u003c/a> · \u003ca href=\"confidentialite.html\">Confidentialité\u003c/a>.\u003c/div>\u003c/footer>\n\u003cscript>\n(function(){\n\"use strict\";\nconst types=[\"inside\",\"below\",\"above\",\"missing_source\",\"missing_method\",\"missing_population\",\"unknown_quality\",\"unknown_identity\",\"bad_identity\",\"bad_quality\",\"interference\",\"invalid_interval\"];\nconst verdict=[\"ALLOW\",\"ALLOW\",\"ALLOW\",\"DELAY\",\"DELAY\",\"DELAY\",\"DELAY\",\"DELAY\",\"BLOCK\",\"BLOCK\",\"BLOCK\",\"UNKNOWN\"];\nconst labels={ref:\"Code fictif\",analyte:\"Paramètre\",value:\"Valeur\",lower:\"Borne basse\",upper:\"Borne haute\",unit:\"Unité\",source:\"Source et version\",method:\"Méthode / appareil\",sample:\"Prélèvement\",population:\"Population / contexte\",identity:\"Identité du prélèvement\",quality:\"Contrôle qualité\",interference:\"Interférence\"};\nconst translate={identity:{yes:\"Vérifiée, fiction\",no:\"Non conforme\",unknown:\"Inconnue\"},quality:{yes:\"Conforme, fiction\",no:\"Non conforme\",unknown:\"Inconnu\"},interference:{yes:\"Présente / suspectée\",no:\"Absente, fiction\",unknown:\"Non vérifiée\"}};\nfunction $(id){return document.getElementById(id);}\nfunction h(s){return String(s).replace(/[&\u003c>\"']/g,c=>({\"&\":\"&amp;\",\"\u003c\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\",\"'\":\"&#39;\"}[c]));}\nfunction seeded(seed){return function(){seed|=0;seed=(seed+0x6D2B79F5)|0;let t=Math.imul(seed^(seed>>>15),1|seed);t^=t+Math.imul(t^(t>>>7),61|t);return ((t^(t>>>14))>>>0)/4294967296;};}\nfunction shuffle(arr,rand){for(let i=arr.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}\nfunction specimen(type,set,index){\n const lo=120+(set*11+index*13)%37,hi=lo+30+(index%6),v=lo+7+(index%17);\n const x={ref:\"SYN-ETUDE-
