le\">Bienvenue dans l'univers de la preuve.\u003c/h2>\u003cdiv class=\"ak-accent-line\">\u003c/div>\u003cp>Un livre et trois ateliers complémentaires. Choisissez votre parcours : comprendre les principes, expérimenter un cas fictif ou suivre la qualité documentaire.\u003c/p>\u003cdiv class=\"ak-guide\" aria-label=\"Guide de démarrage\">\u003ca class=\"ak-guide-step\" href=\"#livre\">\u003cspan class=\"ak-num\" aria-hidden=\"true\">1\u003c/span>\u003cspan>\u003cb>Découvrir le livre\u003c/b>\u003csmall>Lire les fondements scientifiques.\u003c/small>\u003c/span>\u003c/a>\u003ca class=\"ak-guide-step\" href=\"#application\">\u003cspan class=\"ak-num\" aria-hidden=\"true\">2\u003c/span>\u003cspan>\u003cb>Tester l'application\u003c/b>\u003csmall>Vérifier un dossier entièrement fictif.\u003c/small>\u003c/span>\u003c/a>\u003ca class=\"ak-guide-step\" href=\"#workbench\">\u003cspan class=\"ak-num\" aria-hidden=\"true\">3\u003c/span>\u003cspan>\u003cb>Explorer la Workbench\u003c/b>\u003csmall>Suivre règles, écarts et corrections.\u003c/small>\u003c/span>\u003c/a>\u003c/div>\u003cdiv class=\"ak-guide-foot\">\u003ca class=\"ak-action\" href=\"#application\">Découvrir les outils →\u003c/a>\u003cdetails class=\"ak-details\">\u003csummary>Guide d'utilisation et limites\u003c/summary>\u003cp>Les applications sont pédagogiques, sans validation clinique. Elles ne traitent aucune donnée réelle de patient. \u003ca href=\"index.html\">Comprendre le livre\u003c/a> · \u003ca href=\"workbench.html\">Explorer les règles QM\u003c/a> · \u003ca href=\"app.html\">Ouvrir la simulation.\u003c/a>\u003c/p>\u003c/details>\u003cspan class=\"ak-purpose\">Gate 2 clinique : BLOCK\u003c/span>\u003c/div>\u003c/div>\u003c/section>\u003cmain id=\"ak-main\">\u003csection class=\"hero\">\u003cdiv class=\"wrap hero-grid\">\u003cdiv>\u003cdiv class=\"eyebrow\">Édition scientifique documentaire · 2026\u003c/div>\u003ch1>La preuve\u003cbr>avant le\u003cbr>diagnostic\u003cspan style=\"color:var(--gold)\">.\u003c/span>\u003c/h1>\u003cp class=\"lead\">Un résultat biologique n'est pas un diagnostic. Un diagnostic n'est pas une autorisation de traiter. Découvrez le livre et expérimentez une architecture de contrôle documentaire fondée sur PIGA, A7SEM et la traçabilité inverse.\u003c/p>\u003cdiv class=\"actions\">\u003ca class=\"btn gold\" href=\"https://pigapocket.com/la-preuve-avant-le-diagnostic/app.html\">Essayer LA PREUVE LAB →\u003c/a>\u003ca class=\"btn ghost\" href=\"#livre\">Découvrir le livre\u003c/a>\u003c/div>\u003cdiv class=\"facts\">\u003cdiv class=\"fact\">\u003cstrong>378\u003c/strong>pages du fichier scientifique\u003c/div>\u003cdiv class=\"fact\">\u003cstrong>40\u003c/strong>dossiers infectieux\u003c/div>\u003cdiv class=\"fact\">\u003cstrong>2\u003c/strong>gates PIGA\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"bookframe\">\u003cdiv class=\"book\" role=\"img\" aria-label=\"Représentation stylisée non officielle de la couverture de La Preuve avant le Diagnostic\">\u003cdiv class=\"mini\">MÉDECINE · SCIENCE · PREUVE · PRATIQUE\u003c/div>\u003cdiv class=\"big\">LA PREUVE\u003cbr>AVANT LE\u003cbr>DIAGNOSTIC\u003c/div>\u003cdiv class=\"ring\">\u003c/div>\u003cdiv class=\"sub\">ENCYCLOPÉDIE CRITIQUE ET MATHÉMATIQUE DES 40 DIAGNOSTICS INFECTIEUX\u003c/div>\u003cdiv class=\"author\">MOUNIR AKARKACH\u003c/div>\u003c/div>\u003cdiv class=\"booknote\">Illustration éditoriale, non couverture officielle.\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"section\" id=\"livre\">\u003cdiv class=\"wrap\">\u003cdiv class=\"eyebrow\">Le livre\u003c/div>\u003cdiv class=\"intro\">\u003ch2>Passer du résultat à la preuve, pas directement à l'action.\u003c/h2>\u003cp>Un ouvrage de 378 pages consacré à la microbiologie clinique, aux analyses biologiques, à la pharmacologie anti-infectieuse, aux limites diagnostiques et aux preuves. Les tableaux et exemples sont des ressources de formation : ils ne remplacent pas les recommandations actualisées, les références locales ou la responsabilité d'un professionnel habilité.\u003c/p>\u003c/div>\u003cdiv class=\"cards\">\u003carticle class=\"card\">\u003cspan class=\"chip\">01 · OBSERVER\u003c/span>\u003ch3>Contrôler le résultat\u003c/h3>\u003cp>Prélèvement, méthode, unité, intervalle de référence et qualité avant toute hypothèse.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003cspan class=\"chip\">02 · ADMETTRE\u003c/span>\u003ch3>Deux gates distincts\u003c/h3>\u003cp>Gate 1 : peut-on soutenir l'assertion ? Gate 2 : existe-t-il une autorité pour agir ?\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003cspan class=\"chip\">03 · RÉVÉLER\u003c/span>\u003ch3>Remonter la chaîne\u003c/h3>\u003cp>A7SEM Reverse et Glassbox rendent explicites la provenance, les réserves et les contradictions.\u003c/p>\u003c/article>\u003c/div>\u003cdiv class=\"actions\">\u003ca class=\"btn dark\" href=\"https://www.amazon.fr/s?k=9798160971216\" rel=\"noopener noreferrer\" target=\"_blank\">Rechercher le livre sur Amazon · ISBN\u003c/a>\u003ca class=\"btn light\" href=\"https://pigapocket.com/\">Explorer PIGA Pocket\u003c/a>\u003c/div>\u003cp class=\"legal\">ISBN 979-8-16097-121-6 · Mounir Akarkach · Édition scientifique documentaire. Le lien Amazon lance une recherche ISBN ; il ne prétend pas constituer une fiche produit vérifiée.\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"section alt\" id=\"application\">\u003cdiv class=\"wrap cols\">\u003cdiv>\u003cspan class=\"eyebrow\">Application à essayer gratuitement\u003c/span>\u003ch2>LA PREUVE LAB.\u003cbr>Un laboratoire de la preuve.\u003c/h2>\u003cp>Une application Web autonome version 2.0, sans compte ni connexion de données patients. Elle permet de documenter un cas fictif, comparer des chiffres aux bornes que l'utilisateur apporte, visualiser les admissions PIGA, parcourir les 40 intitulés de dossiers, tester le calcul bayésien et exporter un journal de démonstration.\u003c/p>\u003cdiv class=\"actions\">\u003ca class=\"btn dark\" href=\"https://pigapocket.com/la-preuve-avant-le-diagnostic/app.html\">Ouvrir l'application\u003c/a>\u003ca class=\"btn gold\" href=\"https://mounirakarkach04-pixel.github.io/ados/la-preuve-avant-le-diagnostic/LA_PREUVE_LAB_SUITE_OFFLINE_COMPLETE.zip\">Télécharger directement la suite complète (.ZIP) ↓\u003c/a>\u003ca class=\"btn light\" href=\"app.html\" download=\"LA_PREUVE_LAB_v2_OFFLINE.html\">App seule (.HTML) · autres liens en ligne\u003c/a>\u003c/div>\u003cp class=\"legal\">Le fichier HTML seul calcule hors ligne, mais les liens vers les autres pages nécessitent Internet. Pour naviguer entre livre, laboratoire, Workbench, Studio et étude sans connexion, installez le ZIP complet et extrayez-le. Données fictives uniquement.\u003c/p>\u003c/div>\u003cdiv class=\"panel\">\u003cdiv class=\"eyebrow\">PIGA Evidence Workflow\u003c/div>\u003ch3 style=\"font-size:26px\">Contrôler. Suspendre. Retracer.\u003c/h3>\u003cp>L'objectif du prototype est une méthode pédagogique auditable, non un résultat de diagnostic.\u003c/p>\u003cdiv class=\"demo\">\u003cdiv>\u003cstrong>Gate 1\u003c/strong>\u003cspan>ALLOW / DELAY / BLOCK / UNKNOWN\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>Gate 2\u003c/strong>\u003cspan>BLOCK pour tout acte clinique\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>Reverse\u003c/strong>\u003cspan>Justification traçable, réentrée bornée\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"actions\">\u003ca class=\"btn gold\" href=\"https://pigapocket.com/la-preuve-avant-le-diagnostic/app.html\">Tester avec un cas fictif →\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"section\" id=\"evaluation\">\u003cdiv class=\"wrap cols\">\u003cdiv>\u003cdiv class=\"eyebrow\">Étude pilote · revue documentaire fictive\u003c/div>\u003ch2>Mesurer la méthode.\u003cbr>Pas promettre avant la preuve.\u003c/h2>\u003cp>Évaluation comparative à 24 cas entièrement fictifs : une série manuelle et une série assistée par LA PREUVE LAB. Le protocole mesure le temps de contrôle, la concordance avec les règles documentaires et les autorisations inappropriées. Aucune donnée patient, aucun résultat clinique, aucune transmission serveur.\u003c/p>\u003cdiv class=\"actions\">\u003ca class=\"btn dark\" href=\"https://pigapocket.com/la-preuve-avant-le-diagnostic/evaluation.html\">Participer à la simulation QM →\u003c/a>\u003ca class=\"btn light\" href=\"https://pigapocket.com/la-preuve-avant-le-diagnostic/app.html\">Tester l'app\u003c/a>\u003c/div>\u003cp class=\"legal\">Protocole pilote prêt à être utilisé par des évaluateurs volontaires ; aucun bénéfice en laboratoire réel n'est encore démontré.\u003c/p>\u003c/div>\u003cdiv class=\"panel\">\u003cdiv class=\"eyebrow\">PIGA · A7SEM Reverse\u003c/div>\u003ch3>24 simulations, deux conditions, un résultat vérifiable.\u003c/h3>\u003cdiv class=\"demo\">\u003cdiv>\u003cstrong>12 + 12\u003c/strong>\u003cspan>Manuel et avec app\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>0\u003c/strong>\u003cspan>Donnée patient autorisée\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>BLOCK\u003c/strong>\u003cspan>Gate 2 clinique\u003c/span>\u003c/div>\u003c/div>\u003cp style=\"margin-top:15px\">Export du protocole de session en JSON et CSV, uniquement en local.\u003c/p>\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"section alt\" id=\"version2\">\u003cdiv class=\"wrap\">\u003cdiv class=\"eyebrow\">Nouveau · LA PREUVE LAB 2.0\u003c/div>\u003ch2>Plus simple, plus utile, toujours gouverné.\u003c/h2>\u003cp class=\"intro\">La version 2.0 ajoute une saisie guidée en trois étapes, le contrôle local de lots CSV jusqu'à 300 simulations, 40 fiches interactives et un rapport documentaire exportable. Les seuils sont fournis par l'utilisateur, les données restent fictives et Gate 2 interdit toute action clinique.\u003c/p>\u003cdiv class=\"cards\">\u003carticle class=\"card\">\u003cspan class=\"chip\">01 · FACILE\u003c/span>\u003ch3>Saisie accompagnée\u003c/h3>\u003cp>Un parcours clair pour vérifier provenance, méthode, unité, prélèvement et qualité.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003cspan class=\"chip\">02 · LOTS\u003c/span>\u003ch3>Jusqu'à 300 simulations CSV\u003c/h3>\u003cp>Un rapport par ligne : ALLOW, DELAY, BLOCK ou UNKNOWN, avec les motifs explicites.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003cspan class=\"chip\">03 · FORMATION\u003c/span>\u003ch3>40 exercices et audit\u003c/h3>\u003cp>Fiches d'apprentissage et exports JSON/CSV, sans saisie ni transmission de données patient.\u003c/p>\u003c/article>\u003c/div>\u003cdiv class=\"actions\">\u003ca class=\"btn dark\" href=\"https://pigapocket.com/la-preuve-avant-le-diagnostic/app.html\">Essayer la version 2.0 →\u003c/a>\u003ca class=\"btn gold\" href=\"offline-suite.html\">Pack complet hors ligne (.ZIP) →\u003c/a>\u003ca class=\"btn light\" href=\"app.html\" download=\"LA_PREUVE_LAB_v2_OFFLINE.html\">Télécharger la seule app (.HTML)\u003c/a>\u003c/div>\u003cp class=\"legal\">Ces contrôles sont exclusivement documentaires et pédagogiques. Ni logiciel clinique, ni certification ISO/CE, ni validation sur patients.\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"section\" id=\"workbench\">\u003cdiv class=\"wrap\">\u003cdiv class=\"eyebrow\">Nouveau · QM Workbench 3.0 · PIGA\u003c/div>\u003ch2>Une chaîne de qualité, pas seulement un résultat.\u003c/h2>\u003cp class=\"intro\">La nouvelle Workbench simule un véritable parcours de gestion documentaire : règles de contrôle versionnées, précontrôle automatique de 48 à 384 dossiers entièrement fictifs, priorisation P1/P2/P3 des écarts, suivi des actions correctives (CAPA pédagogiques) et replay déterministe A7SEM Reverse avec export JSON/CSV. Aucun nom de patient, aucune connexion à un laboratoire et aucune décision clinique.\u003c/p>\u003cdiv class=\"cards\">\u003carticle class=\"card\">\u003cspan class=\"chip\">01 · RÈGLES\u003c/span>\u003ch3>Précontrôles configurables\u003c/h3>\u003cp>Règles fondamentales protégées et catalogue documentaire complémentaire versionné.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003cspan class=\"chip\">02 · ÉCARTS\u003c/span>\u003ch3>Priorités et CAPA\u003c/h3>\u003cp>Classer les conditions manquantes, suivre les actions fictives et conserver les explications.\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003cspan class=\"chip\">03 · PREUVES\u003c/span>\u003ch3>Replay et traçabilité\u003c/h3>\u003cp>Rejouer les mêmes cas avec les règles originales et vérifier les résultats avant export local.\u003c/p>\u003c/article>\u003c/div>\u003cdiv class=\"actions\">\u003ca class=\"btn dark\" href=\"https://pigapocket.com/la-preuve-avant-le-diagnostic/workbench.html\">Ouvrir la Workbench 3.0 →\u003c/a>\u003ca class=\"btn gold\" href=\"offline-suite.html\">Installer toutes les pages hors ligne (.ZIP)\u003c/a>\u003ca class=\"btn light\" href=\"workbench.html\" download=\"LA_PREUVE_LAB_QM_WORKBENCH_v3_OFFLINE.html\">Workbench seule (.HTML)\u003c/a>\u003c/div>\u003cp class=\"legal\">Exercices de recherche exclusivement synthétiques. Aucun usage pour diagnostiquer, prescrire, gérer des données patients ou délivrer des résultats. Les CAPA ne lèvent jamais automatiquement le Gate 2 clinique.\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"section\" id=\"studio\">\u003cdiv class=\"wrap cols\">\u003cdiv>\u003cdiv class=\"eyebrow\">Nouveau · LA PREUVE LAB Studio\u003c/div>\u003ch2>La preuve devient un exercice interactif.\u003c/h2>\u003cp>Retrouvez les modules du laboratoire dans un espace pédagogique au design éditorial : sélection de cas fictifs, contrôles Gate 1, simulation de conséquences hypothétiques, visualisation bayésienne, création d'exercices, import limité de données synthétiques et dialogue Laboratoire–Clinicien.\u003c/p>\u003cdiv class=\"actions\">\u003ca class=\"btn dark\" href=\"studio.html\">Ouvrir le Studio interactif →\u003c/a>\u003ca class=\"btn light\" href=\"offline-suite.html\">Télécharger toute la suite hors ligne\u003c/a>\u003c/div>\u003cp class=\"legal\">Cas intégralement inventés. Le système n'établit aucune décision médicale ; Gate 2 clinique : BLOCK.\u003c/p>\u003c/div>\u003cdiv class=\"panel\">\u003cdiv class=\"eyebrow\">PIGA / A7SEM Reverse\u003c/div>\u003ch3>Explorer · vérifier · expliquer\u003c/h3>\u003cdiv class=\"demo\">\u003cdiv>\u003cstrong>1 000\u003c/strong>\u003cspan>Observations fictives visualisées dans Bayes\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>3\u003c/strong>\u003cspan>Formats d'import pédagogique limités\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>BLOCK\u003c/strong>\u003cspan>Action clinique permanente\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"section alt\" id=\"offline-complet\">\u003cdiv class=\"wrap\">\u003cdiv class=\"eyebrow\">Navigation entièrement hors ligne · gratuit\u003c/div>\u003ch2>Tous les outils. Un seul dossier.\u003c/h2>\u003cp class=\"intro\">Un fichier HTML téléchargé seul ne contient pas les autres pages. Pour passer du livre à l'application, à la Workbench et à l'étude même sans Internet, téléchargez la suite complète au format ZIP et extrayez tous les fichiers dans un même dossier.\u003c/p>\u003cdiv class=\"actions\">\u003ca class=\"btn dark\" href=\"https://mounirakarkach04-pixel.github.io/ados/la-preuve-avant-le-diagnostic/LA_PREUVE_LAB_SUITE_OFFLINE_COMPLETE.zip\">Télécharger directement le ZIP complet ↓\u003c/a>\u003ca class=\"btn light\" href=\"app.html\">Ouvrir l'application en ligne\u003c/a>\u003c/div>\u003cp class=\"legal\">La création de l'archive nécessite une connexion une seule fois. Les liens vers des sites extérieurs continuent de nécessiter Internet. Aucune donnée patient, aucune autorisation clinique.\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"section\" id=\"licence\">\u003cdiv class=\"wrap\">\u003cdiv class=\"eyebrow\">Recherche, formation, licence\u003c/div>\u003ch2>Tester librement. Déployer professionnellement par licence.\u003c/h2>\u003cdiv class=\"cards\">\u003carticle class=\"card\">\u003ch3>Démonstration individuelle\u003c/h3>\u003cp>Consultation gratuite du prototype et simulations entièrement fictives. Aucune licence clinique ni droit de redistribution accordés.\u003c/p>\u003ca href=\"https://pigapocket.com/la-preuve-avant-le-diagnostic/licence.html\">Lire les conditions →\u003c/a>\u003c/article>\u003carticle class=\"card\">\u003ch3>Laboratoires, universités, pharmacie\u003c/h3>\u003cp>Ateliers de formation, licences institutionnelles, audit documentaire, adaptations ciblées : les droits et limites sont définis par accord écrit préalable.\u003c/p>\u003ca href=\"mailto:moakarkach@hotmail.de?subject=LA%20PREUVE%20LAB%20-%20Demande%20de%20licence\">Demander une licence écrite →\u003c/a>\u003c/article>\u003carticle class=\"card\">\u003ch3>Infrastructure PIGA\u003c/h3>\u003cp>PIGA Master Governance, Glassbox Evidence, admission et contrôle d'action pour les projets institutionnels, avec examen de leur applicabilité au cas concret.\u003c/p>\u003ca href=\"https://pigapocket.com/\">Voir l'écosystème PIGA →\u003c/a>\u003c/article>\u003c/div>\u003cp class=\"legal\">Avertissement essentiel : ce prototype n'est pas un dispositif médical validé ni certifié, et ne convient ni au traitement de données de santé réelles ni au diagnostic, triage, suivi médical ou prescription. Une qualification réglementaire, validation, gestion de risques et conformité seraient requises avant tout usage clinique.\u003c/p>\u003c/div>\u003c/section>\u003cdiv class=\"ak-ecosystem\">\u003cstrong>Famille de recherche Mounir Akarkach.\u003c/strong> PIGA et A7SEM constituent les méthodes de gouvernance de cet atelier. Le programme \u003ca href=\"https://pigapocket.com/ados/\">ADOS — Akarkach Diagnostic Operating System\u003c/a> explore la psychologie : il reste distinct du travail documentaire en biologie présenté ici.\u003c/div>\u003c/main>\u003cfooter>\u003cdiv class=\"wrap\">\u003cp>© 2026 Mounir Akarkach · Tous droits réservés · PIGA Maste /\">ADOS — Akarkach Diagnostic Operating System\u003c/a>\u003cspan class=\"ak-small\">(distinct de ce laboratoire)\u003c/span>\u003c/div>\u003c/div>\u003c/div>\n\u003cheader class=\"ak-header\">\u003cdiv class=\"ak-bar\">\u003ca class=\"ak-mark\" href=\"index.html\">\u003cspan class=\"ak-mark-icon\" aria-hidden=\"true\">✦\u003c/span> LA PREUVE \u003cem>LAB\u003c/em>\u003c/a>\u003cnav class=\"ak-links\" aria-label=\"Navigation principale\">\u003ca href=\"index.html\">Livre\u003c/a>\u003ca href=\"app.html\" aria-current=\"page\">LA PREUVE LAB\u003c/a>\u003ca href=\"workbench.html\">QM Workbench\u003c/a>\u003ca href=\"studio.html\">Studio interactif\u003c/a>\u003ca href=\"evaluation.html\">Étude pilote\u003c/a>\u003c/nav>\u003c/div>\u003c/header>\n\u003caside id=\"lapreuve-offline-book-return\" aria-label=\"Retour vers le livre\" style=\"background:#e5f2ed;border-bottom:2px solid #b1cfc3;color:#173942;padding:13px 18px;font:14px/1.6 system-ui,sans-serif\">\n\u003cdiv style=\"max-width:1140px;margin:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap\">\n\u003cstrong>LA PREUVE LAB · La preuve avant le diagnostic\u003c/strong>\n\u003ca href=\"https://pigapocket.com/la-preuve-avant-le-diagnostic/\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"background:#12424c;color:white;text-decoration:none;padding:9px 15px;border-radius:9px;font-weight:800\">← Retour au livre\u003c/a>\n\u003ca href=\"https://mounirakarkach04-pixel.github.io/ados/la-preuve-avant-le-diagnostic/\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color:#135063;text-decoration:underline\">Page du livre de secours ↗\u003c/a>\n\u003cdetails style=\"flex-basis:100%;margin-top:4px\">\u003csummary style=\"cursor:pointer;font-weight:800\">Présentation du livre accessible sans Internet\u003c/summary>\u003cp style=\"margin:8px 0 4px\">\u003cb>La preuve avant le diagnostic\u003c/b> · 378 pages · ISBN 979-8-16097-121-6. Un ouvrage scientifique de pédagogie documentaire sur les résultats de laboratoire, 40 dossiers infectieux, la qualité des preuves et les limites de l'inférence. LA PREUVE LAB illustre les contrôles PIGA/A7SEM à partir de cas fictifs. Pour consulter la page complète du livre, une connexion Internet est nécessaire hors de la suite ZIP.\u003c/p>\u003c/details>\n\u003c/div>\u003c/aside>\u003csection class=\"ak-welcome\" aria-labelledby=\"ak-title\">\u003cdiv class=\"ak-welcome-body\">\u003cspan class=\"ak-eyebrow\">Mounir Akarkach · La preuve avant le diagnostic · Recherche 2026\u003c/span>\u003ch2 id=\"ak-title\">Bienvenue dans LA PREUVE LAB.\u003c/h2>\u003cdiv class=\"ak-accent-line\">\u003c/div>\u003cp>Une première visite ? Suivez ces trois étapes. Tout fonctionne localement : valeurs, règles et exports restent sur votre appareil.\u003c/p>\u003cdiv class=\"ak-guide\" aria-label=\"Guide de démarrage\">\u003ca class=\"ak-guide-step\" href=\"#guide\" data-ak-pane=\"guide\">\u003cspan class=\"ak-num\" aria-hidden=\"true\">1\u003c/span>\u003cspan>\u003cb>Charger un exemple\u003c/b>\u003csmall>La saisie facile est ouverte dès l'arrivée.\u003c/small>\u003c/span>\u003c/a>\u003ca class=\"ak-guide-step\" href=\"#lots\" data-ak-pane=\"lots\">\u003cspan class=\"ak-num\" aria-hidden=\"true\">2\u003c/span>\u003cspan>\u003cb>Contrôler Gate 1\u003c/b>\u003csmall>Lire le statut et la justification.\u003c/small>\u003c/span>\u003c/a>\u003ca class=\"ak-guide-step\" href=\"#rapports\" data-ak-pane=\"rapports\">\u003cspan class=\"ak-num\" aria-hidden=\"true\">3\u003c/span>\u003cspan>\u003cb>Exporter un rapport\u003c/b>\u003csmall>Conserver une trace de votre simulation.\u003c/small>\u003c/span>\u003c/a>\u003c/div>\u003cdiv class=\"ak-guide-foot\">\u003ca class=\"ak-action\" href=\"#guide\">Commencer avec un cas fictif →\u003c/a>\u003cdetails class=\"ak-details\">\u003csummary>Guide d'utilisation et limites\u003c/summary>\u003cp>Pour traiter plusieurs simulations, ouvrez l'onglet « Lots CSV ». Un statut ALLOW n'autorise aucune décision clinique. \u003ca href=\"index.html\">Comprendre le livre\u003c/a> · \u003ca href=\"workbench.html\">Explorer les règles QM\u003c/a> · \u003ca href=\"app.html\">Ouvrir la simulation.\u003c/a>\u003c/p>\u003c/details>\u003cspan class=\"ak-purpose\">Gate 2 clinique : BLOCK\u003c/span>\u003c/div>\u003c/div>\u003c/section>\u003cdiv class=\"wrap\">\u003csection class=\"hero\">\u003cspan class=\"eyebrow\">PIGA · A7SEM · Glassbox · Reverse\u003c/span>\u003ch1>La preuve avant\u003cbr>le diagnostic.\u003c/h1>\u003cp class=\"muted\">Atelier documentaire pour techniciens, biologistes, pharmaciens et chercheurs : comparaison d'une valeur à \u003cb>l'intervalle fourni\u003c/b>, vérification de provenance, registre auditable et calcul bayésien pédagogique.\u003c/p>\u003caside class=\"warning\">VERSION DE RECHERCHE / FORMATION — \u003cb>cas fictifs exclusivement.\u003c/b> Ni diagnostic, ni prescription, ni interprétation clinique validée, ni transmission vers un laboratoire. Ne saisir aucune donnée de patient identifiable. Gate 2 clinique toujours BLOCK.\u003c/aside>\u003c/section>\n\u003cnav class=\"tabs\" aria-label=\"Modules · choisissez votre étape\">\u003cbutton class=\"tab active\" data-tab=\"guide\" type=\"button\">01 · Saisie facile\u003c/button>\u003cbutton class=\"tab\" data-tab=\"lots\" type=\"button\">02 · Lots CSV\u003c/button>\u003cbutton class=\"tab\" data-tab=\"fiches\" type=\"button\">03 · Exercices\u003c/button>\u003cbutton class=\"tab\" data-tab=\"rapports\" type=\"button\">04 · Rapports\u003c/button>\u003cbutton class=\"tab\" data-tab=\"controle\" type=\"button\">Contrôle avancé\u003c/button>\u003cbutton class=\"tab\" data-tab=\"governance\" type=\"button\">PIGA & Reverse\u003c/button>\u003cbutton class=\"tab\" data-tab=\"bayes\" type=\"button\">Calcul Bayes\u003c/button>\u003cbutton class=\"tab\" data-tab=\"atlas\" type=\"button\">40 dossiers\u003c/button>\u003cbutton class=\"tab\" data-tab=\"journal\" type=\"button\">Registre\u003c/button>\u003c/nav>\n\u003cmain id=\"ak-main\">\u003csection class=\"pane\" id=\"controle\">\u003cdiv class=\"three\">\u003cdiv class=\"metric\">\u003cstrong id=\"count\">0\u003c/strong>\u003cspan>Contrôles de cette session\u003c/span>\u003c/div>\u003cdiv class=\"metric\">\u003cstrong id=\"suspended\">0\u003c/strong>\u003cspan>Retenus, inconnus ou bloqués\u003c/span>\u003c/div>\u003cdiv class=\"metric\">\u003cstrong>0\u003c/strong>\u003cspan>Actions cliniques exécutées\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"cols\">\u003cdiv class=\"surface\">\u003ch2>Contrôle de preuve\u003c/h2>\u003cp class=\"fine\">Saisie locale uniquement. Aucune valeur ni identification réelle : même l'export doit rester fictif.\u003c/p>\u003cdiv class=\"field\">\u003clabel for=\"ref\">Code fictif\u003c/label>\u003cinput id=\"ref\" maxlength=\"60\" value=\"DEMO-001\" autocomplete=\"off\">\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"analyte\">Paramètre\u003c/label>\u003cinput id=\"analyte\" maxlength=\"100\" placeholder=\"Hémoglobine, créatinine, etc.\">\u003c/div>\u003cdiv class=\"three\">\u003cdiv class=\"field\">\u003clabel for=\"value\">Valeur\u003c/label>\u003cinput id=\"value\" type=\"number\" step=\"any\" placeholder=\"99\">\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"lower\">Borne basse\u003c/label>\u003cinput id=\"lower\" type=\"number\" step=\"any\" placeholder=\"120\">\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"upper\">Borne haute\u003c/label>\u003cinput id=\"upper\" type=\"number\" step=\"any\" placeholder=\"160\">\u003c/div>\u003c/div>\u003cdiv class=\"cols\">\u003cdiv class=\"field\">\u003clabel for=\"unit\">Unité commune\u003c/label>\u003cinput id=\"unit\" maxlength=\"30\" placeholder=\"g/L\">\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"source\">Source de l'intervalle, version\u003c/label>\u003cinput id=\"source\" maxlength=\"170\" placeholder=\"Référentiel fictif, version, date\">\u003c/div>\u003c/div>\u003cdiv class=\"cols\">\u003cdiv class=\"field\">\u003clabel for=\"method\">Méthode / appareil\u003c/label>\u003cinput id=\"method\" maxlength=\"100\">\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"sample\">Type de prélèvement\u003c/label>\u003cinput id=\"sample\" maxlength=\"100\">\u003c/div>\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"population\">Population et contexte de l'intervalle\u003c/label>\u003cinput id=\"population\" maxlength=\"140\" placeholder=\"Contexte de validité, jamais universel\">\u003c/div>\u003cdiv class=\"three\">\u003cdiv class=\"field\">\u003clabel for=\"identity\">Correspondance échantillon\u003c/label>\u003cselect id=\"identity\">\u003coption value=\"unknown\">Inconnue\u003c/option>\u003coption value=\"yes\">Vérifiée, fiction\u003c/option>\u003coption value=\"no\">Non conforme\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"quality\">Contrôle qualité\u003c/label>\u003cselect id=\"quality\">\u003coption value=\"unknown\">Inconnu\u003c/option>\u003coption value=\"yes\">Conforme, fiction\u003c/option>\u003coption value=\"no\">Non conforme\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"interference\">Interférence / hémolyse\u003c/label>\u003cselect id=\"interference\">\u003coption value=\"unknown\">Non vérifiée\u003c/option>\u003coption value=\"no\">Absente, fiction\u003c/option>\u003coption value=\"yes\">Suspectée ou présente\u003c/option>\u003c/select>\u003c/div>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton class=\"btn\" id=\"run\">Contrôler\u003c/button>\u003cbutton class=\"btn alt\" id=\"example\">Exemple fictif\u003c/button>\u003cbutton class=\"btn alt\" id=\"reset\">Effacer\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"surface\">\u003ch2>Lecture documentée\u003c/h2>\u003cdiv id=\"result\" class=\"status\" aria-live=\"polite\">\u003cspan class=\"pill\">UNKNOWN\u003c/span>\u003ch3>Pas encore de contrôle\u003c/h3>\u003cp>Complétez les champs ; l'outil ne conclut jamais à une maladie.\u003c/p>\u003c/div>\u003ch3>Principes non négociables\u003c/h3>\u003cp class=\"fine\">Un marqueur anormal n'indique pas automatiquement une maladie. Une PCR positive ne prouve pas la viabilité d'un pathogène. Une valeur normale n'exclut pas une pathologie. L'application ne fournit ni seuils cliniques universels ni recommandations thérapeutiques.\u003c/p>\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"pane\" id=\"governance\">\u003cdiv class=\"surface\">\u003ch2>Double admission PIGA\u003c/h2>\u003cdiv class=\"cols\">\u003cdiv class=\"status\">\u003cspan id=\"gate1\" class=\"pill\">UNKNOWN\u003c/span>\u003ch3>Gate 1 · Inférence documentaire\u003c/h3>\u003cp id=\"g1text\">Vérification conditionnelle des unités, méthodes, bornes, provenance et contrôles.\u003c/p>\u003c/div>\u003cdiv class=\"status\">\u003cspan class=\"pill block\">BLOCK\u003c/span>\u003ch3>Gate 2 · Action clinique\u003c/h3>\u003cp>Toujours bloqué. Aucune délivrance de résultat patient, prescription, triage médical, décision de traitement ou action SIL/LIMS.\u003c/p>\u003c/div>\u003c/div>\u003ch3>Sept vérifications opérationnelles\u003c/h3>\u003cdiv class=\"steps\" id=\"steps\">\u003c/div>\u003cp class=\"fine\">Séquence documentaire adaptée à la lecture de l'ouvrage ; elle ne revendique pas de certification A7SEM.\u003c/p>\u003ch3>A7SEM Reverse\u003c/h3>\u003cp id=\"reverse\">Aucun contrôle exécuté : la remontée de preuves reste inconnue.\u003c/p>\u003cbutton class=\"btn alt\" id=\"reentry\">Réentrée : vérifier à nouveau\u003c/button>\u003cp class=\"fine\">Boucle finie : 7 réentrées maximum par dossier fictif. Une nouvelle fiche lance un nouveau cycle ; aucune boucle infinie autonome ni action en arrière-plan.\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"pane\" id=\"atlas\">\u003cdiv class=\"surface\">\u003ch2>Index des 40 diagnostics infectieux\u003c/h2>\u003cp class=\"fine\">Titres tirés de « La preuve avant le diagnostic », dossiers D-001 à D-040. Index seulement : pas de conseil clinique.\u003c/p>\u003cdiv class=\"field\">\u003clabel for=\"search\">Filtrer les dossiers\u003c/label>\u003cinput id=\"search\" type=\"search\" placeholder=\"STEC, méningite, VIH…\">\u003c/div>\u003cdiv id=\"atlaslist\" class=\"atlas\">\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"pane\" id=\"bayes\">\u003cdiv class=\"surface\">\u003ch2>Valeurs prédictives · étude fictive\u003c/h2>\u003cp class=\"fine\">VPP = Se × p / [Se × p + (1 − Sp) × (1 − p)]. Exemple du livre : 95 % de sensibilité, 98 % de spécificité, 1 % de prévalence → environ 32,4 % de VPP. Aucune probabilité individuelle ne peut être déduite sans validation contextuelle.\u003c/p>\u003cdiv class=\"three\">\u003cdiv class=\"field\">\u003clabel for=\"se\">Sensibilité (%)\u003c/label>\u003cinput id=\"se\" type=\"number\" value=\"95\" min=\"0\" max=\"100\" step=\"any\">\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"sp\">Spécificité (%)\u003c/label>\u003cinput id=\"sp\" type=\"number\" value=\"98\" min=\"0\" max=\"100\" step=\"any\">\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"pre\">Prévalence préalable (%)\u003c/label>\u003cinput id=\"pre\" type=\"number\" value=\"1\" min=\"0\" max=\"100\" step=\"any\">\u003c/div>\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"bayesSource\">Source / population\u003c/label>\u003cinput id=\"bayesSource\" placeholder=\"Pédagogique fictif · aucune transposition clinique\">\u003c/div>\u003cbutton class=\"btn\" id=\"compute\">Calculer VPP et VPN\u003c/button>\u003cdiv id=\"bayesout\" class=\"status\" style=\"margin-top:14px\" aria-live=\"polite\">Renseignez des hypothèses cohérentes, exprimées en pourcentage.\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"pane\" id=\"journal\">\u003cdiv class=\"surface\">\u003ch2>Glassbox · journal de session\u003c/h2>\u003cp class=\"fine\">Journal en mémoire volatile : aucun envoi et aucun stockage permanent. Rechargement = effacement. Exportez uniquement des simulations.\u003c/p>\u003cdiv class=\"actions\">\u003cbutton class=\"btn\" id=\"json\">Exporter JSON\u003c/button>\u003cbutton class=\"btn alt\" id=\"csv\">Exporter CSV\u003c/button>\u003cbutton class=\"btn alt\" id=\"print\">Imprimer / PDF\u003c/button>\u003cbutton class=\"btn alt\" id=\"erase\">Effacer journal\u003c/button>\u003c/div>\u003cdiv class=\"audit\" id=\"events\">\u003cp class=\"fine\">Aucun événement.\u003c/p>\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"pane active\" id=\"guide\">\u003cdiv class=\"surface\">\n \u003cspan class=\"eyebrow\">Nouveau · v2.0 · laboratoire documentaire fictif\u003c/span>\u003ch2>Saisie facile en trois étapes\u003c/h2>\n \u003cp class=\"muted\">Une seule fiche guidée. Les champs essentiels sont expliqués ; les contrôles utilisent la même fonction Gate 1 que la version classique. Aucun identifiant ni résultat réel.\u003c/p>\n \u003cdiv class=\"v2grid\">\n  \u003cdiv class=\"v2card\">\u003ch3>1 · Valeur et intervalle\u003c/h3>\u003cdiv class=\"field\">\u003clabel for=\"q-id\">Identifiant fictif (SYN-…)\u003c/label>\u003cinput id=\"q-id\" value=\"SYN-DEMO-001\" maxlength=\"50\">\u003c/div>\n   \u003cdiv class=\"field\">\u003clabel for=\"q-analyte\">Paramètre fictif\u003c/label>\u003cinput id=\"q-analyte\" value=\"ANALYTE_FICTIF\" maxlength=\"80\">\u003c/div>\n   \u003cdiv class=\"three\">\u003cdiv class=\"field\">\u003clabel for=\"q-value\">Valeur\u003c/label>\u003cinput id=\"q-value\" type=\"number\" step=\"any\" value=\"140\">\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"q-low\">Minimum\u003c/label>\u003cinput id=\"q-low\" type=\"number\" step=\"any\" value=\"120\">\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"q-high\">Maximum\u003c/label>\u003cinput id=\"q-high\" type=\"number\" step=\"any\" value=\"160\">\u003c/div>\u003c/div>\n   \u003cdiv class=\"field\">\u003clabel for=\"q-unit\">Unité commune · aucune conversion automatique\u003c/label>\u003cinput id=\"q-unit\" value=\"U_fictive\" maxlength=\"30\">\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"v2card\">\u003ch3>2 · Origine et qualité\u003c/h3>\n   \u003cdiv class=\"field\">\u003clabel for=\"q-source\">Source/version de l'intervalle\u003c/label>\u003cinput id=\"q-source\" value=\"Reference_fictive_v1\" maxlength=\"100\">\u003c/div>\n   \u003cdiv class=\"field\">\u003clabel for=\"q-method\">Méthode / instrument\u003c/label>\u003cinput id=\"q-method\" value=\"Instrument_fictif\" maxlength=\"100\">\u003c/div>\n   \u003cdiv class=\"field\">\u003clabel for=\"q-sample\">Type de prélèvement\u003c/label>\u003cinput id=\"q-sample\" value=\"Prelevement_fictif\" maxlength=\"80\">\u003c/div>\n   \u003cdiv class=\"field\">\u003clabel for=\"q-population\">Population de référence / contexte fictif\u003c/label>\u003cinput id=\"q-population\" value=\"Population_fictive\" maxlength=\"100\">\u003c/div>\n   \u003cdiv class=\"three\">\u003cdiv class=\"field\">\u003clabel for=\"q-identity\">Identité\u003c/label>\u003cselect id=\"q-identity\">\u003coption value=\"yes\">Conforme\u003c/option>\u003coption value=\"unknown\">Inconnue\u003c/option>\u003coption value=\"no\">Non conforme\u003c/option>\u003c/select>\u003c/div>\n   \u003cdiv class=\"field\">\u003clabel for=\"q-quality\">Qualité\u003c/label>\u003cselect id=\"q-quality\">\u003coption value=\"yes\">Conforme\u003c/option>\u003coption value=\"unknown\">Inconnue\u003c/option>\u003coption value=\"no\">Non conforme\u003c/option>\u003c/select>\u003c/div>\n   \u003cdiv class=\"field\">\u003clabel for=\"q-interference\">Interférence\u003c/label>\u003cselect id=\"q-interference\">\u003coption value=\"no\">Absente\u003c/option>\u003coption value=\"unknown\">Inconnue\u003c/option>\u003coption value=\"yes\">Suspectée\u003c/option>\u003c/select>\u003c/div>\u003c/div>\n  \u003c/div>\n \u003c/div>\n \u003cdiv class=\"v2card\">\u003ch3>3 · Contrôle et explication\u003c/h3>\u003cdiv class=\"actions\">\u003cbutton class=\"btn\" id=\"q-run\">Vérifier le dossier fictif\u003c/button>\u003cbutton class=\"btn alt\" id=\"q-issue\">Simuler un défaut\u003c/button>\u003cbutton class=\"btn alt\" id=\"q-reset\">Restaurer l'exemple\u003c/button>\u003c/div>\u003cdiv id=\"q-out\" class=\"v2result v2line\" aria-live=\"polite\">Prêt pour la simulation. Gate 2 clinique : BLOCK.\u003c/div>\u003cp class=\"v2hint\">Un ALLOW autorise seulement la comparaison arithmétique documentaire et ne valide jamais un examen médical.\u003c/p>\u003c/div>\n\u003c/div>\u003c/section>\n\u003csection class=\"pane\" id=\"lots\">\u003cdiv class=\"surface\">\n \u003cspan class=\"eyebrow\">v2.0 · contrôle documentaire en série\u003c/span>\u003ch2>Analyser jusqu'à 300 lignes fictives\u003c/h2>\n \u003cp class=\"muted\">Collez un CSV local (point-virgule ou virgule). Vérifiez les dossiers et les motifs de DELAY/BLOCK/UNKNOWN en une opération. Aucun envoi serveur, aucun accès à un SIL/LIMS.\u003c/p>\n \u003cdiv class=\"actions\">\u003cbutton class=\"btn alt\" id=\"lot-demo\">Charger 100 cas synthétiques\u003c/button>\u003cbutton class=\"btn alt\" id=\"lot-template\">Télécharger le modèle CSV\u003c/button>\u003cbutton class=\"btn alt\" id=\"lot-clear\">Effacer la saisie\u003c/button>\u003c/div>\n \u003cdiv class=\"field\">\u003clabel for=\"lot-file\">Ou importer un fichier CSV fictif depuis votre appareil (max. 250 Ko)\u003c/label>\u003cinput id=\"lot-file\" type=\"file\" accept=\".csv,text/csv\" aria-label=\"Importer un fichier CSV fictif exclusivement\">\u003c/div>\n \u003cdiv class=\"field\">\u003clabel for=\"lot-text\">CSV fictif · colonnes id;analyte;value;lower;upper;unit;source;method;sample;population;identity;quality;interference\u003c/label>\u003ctextarea id=\"lot-text\" class=\"v2text\" spellcheck=\"false\" placeholder=\"id;analyte;value;lower;upper;unit;source;method;sample;population;identity;quality;interference\" aria-label=\"CSV de simulations uniquement\">\u003c/textarea>\u003c/div>\n \u003cdiv class=\"actions\">\u003cbutton class=\"btn\" id=\"lot-run\">Analyser le lot\u003c/button>\u003cbutton class=\"btn alt\" id=\"lot-export\">Exporter résultats CSV\u003c/button>\u003c/div>\n \u003cdiv id=\"lot-summary\" class=\"v2line\" aria-live=\"polite\">Aucun lot évalué.\u003c/div>\u003cdiv id=\"lot-output\" class=\"v2table v2scroll\">\u003c/div>\n \u003cp class=\"v2foot\">Sécurité : les identifiants doivent commencer par SYN-. N'importez jamais d'identifiants, de données de santé ou de fichiers de patients. La validation de préfixe n'est pas un système d'anonymisation.\u003c/p>\n\u003c/div>\u003c/section>\n\u003csection class=\"pane\" id=\"fiches\">\u003cdiv class=\"surface\">\n \u003cspan class=\"eyebrow\">v2.0 · formation par l'erreur\u003c/span>\u003ch2>40 fiches, chacune avec un exercice\u003c/h2>\u003cp class=\"muted\">Consultez les quarante intitulés de l'ouvrage et entraînez-vous à identifier une condition manquante avant une inférence. Ces exercices ne fournissent aucun diagnostic ni protocole thérapeutique.\u003c/p>\n \u003cdiv class=\"field\">\u003clabel for=\"f-search\">Rechercher une fiche\u003c/label>\u003cinput id=\"f-search\" type=\"search\" placeholder=\"VIH, tuberculose, paludisme, D-030…\">\u003c/div>\n \u003cdiv id=\"f-list\" class=\"v2grid v2scroll\">\u003c/div>\u003cdiv id=\"f-exercise\" class=\"v2card hidden\" aria-live=\"polite\">\u003c/div>\n\u003c/div>\u003c/section>\n\u003csection class=\"pane\" id=\"rapports\">\u003cdiv class=\"surface\">\n \u003cspan class=\"eyebrow\">v2.0 · transparence et reproductibilité\u003c/span>\u003ch2>Tableau de bord documentaire\u003c/h2>\n \u003cp class=\"muted\">Synthèse des vérifications réalisées dans les modules v2 de cette session. L'ancien journal reste accessible dans l'onglet « Registre ». Aucun rapport n'est médicalement certifié.\u003c/p>\n \u003cdiv class=\"three\">\u003cdiv class=\"metric\">\u003cstrong id=\"r-total\">0\u003c/strong>\u003cspan>Cas fictifs contrôlés v2\u003c/span>\u003c/div>\u003cdiv class=\"metric\">\u003cstrong id=\"r-holds\">0\u003c/strong>\u003cspan>Statuts non ALLOW\u003c/span>\u003c/div>\u003cdiv class=\"metric\">\u003cstrong id=\"r-block\">BLOCK\u003c/strong>\u003cspan>Gate 2 clinique : permanent\u003c/span>\u003c/div>\u003c/div>\n \u003cdiv class=\"v2card\">\u003ch3>Registre avec empreinte SHA-256 (si disponible)\u003c/h3>\u003cdiv class=\"actions\">\u003cbutton class=\"btn\" id=\"r-json\">Exporter rapport JSON\u003c/button>\u003cbutton class=\"btn alt\" id=\"r-csv\">Exporter journal CSV\u003c/button>\u003cbutton class=\"btn alt\" id=\"r-print\">Imprimer / PDF\u003c/button>\u003cbutton class=\"btn alt\" id=\"r-clear\">Effacer v2\u003c/button>\u003c/div>\u003cp class=\"v2hint\">Le hachage détecte certaines modifications du fichier lorsqu'on compare l'empreinte à une copie fiable. Il ne crée ni signature, ni horodatage tiers, ni journal juridiquement inviolable.\u003c/p>\u003cdiv id=\"r-status\" class=\"v2line\">Aucune donnée conservée.\u003c/div>\u003c/div>\n \u003cdiv id=\"r-table\" class=\"v2table\">\u003c/div>\u003cp class=\"fine\">Références méthodologiques : \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.who.int/publications/i/item/9789241548274\">OMS – Laboratory Quality Management System\u003c/a>. Aucun label ISO/CE ni conformité à la norme n'est revendiqué.\u003c/p>\n\u003c/div>\u003c/section>\n\u003c/main>\u003c/div>\u003cfooter>\u003cdiv class=\"wrap\">© 2026 Mounir Akarkach · LA PREUVE LAB v2.0 · Recherche et pédagogie seulement · \u003ca href=\"licence.html\">Licence\u003c/a> · \u003ca href=\"confidentialite.html\">Confidentialité\u003c/a> · \u003ca href=\"https://pigapocket.com/\">PIGA Pocket\u003c/a>\u003c/div>\u003c/footer>\n\u003cscript>\n(function(){\n\"use strict\";\nvar $=function(id){return document.getElementById(id)}, events=[],cycles=0,last=null;\nvar diseases=[\"VIH-1\",\"VIH-2\",\"SIDA : stadification clinique et immunologique\",\"Hépatite B\",\"Hépatite C\",\"Papillomavirus humain\",\"Herpès simplex\",\"SARS-CoV-2\",\"Grippe\",\"Virus respiratoire syncytial\",\"Virus Epstein-Barr\",\"Cytomégalovirus\",\"Dengue\",\"Zika\",\"R dth:1.8;stroke-linecap:round;stroke-linejoin:round}\n body.ak-v4{padding-bottom:calc(75px + env(safe-area-inset-bottom))}\n .ak-v4 .ak-header{position:relative}\n .ak-v4 .ak-welcome h2{font-size:27px}\n .ak-v4 .ak-welcome-body{border-radius:17px}\n .ak-v4 .ak-guide-step{padding:12px}\n .ak-v4 .ak-mast-right .ak-small{display:none}\n}\n@media(prefers-reduced-motion:reduce){.ak-v4 a.ak-guide-step:hover,.ak-v4 .ak-action:hover,.ak-v4 :where(.card,.v2card):hover{transform:none}}\n\n\u003c/style>\u003c/head>\u003cbody class=\"ak-v4 ak-qm\">\n\u003ca class=\"ak-skip\" href=\"#ak-main\">Aller au contenu principal\u003c/a>\n\u003cdiv class=\"ak-mast\">\u003cdiv class=\"ak-wrap\">\u003cdiv>\u003cstrong class=\"ak-author\">MOUNIR AKARKACH\u003c/strong> \u003cspan class=\"ak-author-sub\">· Auteur & chercheur indépendant · PIGA / A7SEM\u003c/span>\u003c/div>\u003cdiv class=\"ak-mast-right\">\u003cspan>Autre programme en psychologie :\u003c/span>\u003ca href=\"https://pigapocket.com/ados/\">ADOS — Akarkach Diagnostic Operating System\u003c/a>\u003cspan class=\"ak-small\">(distinct de ce laboratoire)\u003c/span>\u003c/div>\u003c/div>\u003c/div>\n\u003cheader class=\"ak-header\">\u003cdiv class=\"ak-bar\">\u003ca class=\"ak-mark\" href=\"index.html\">\u003cspan class=\"ak-mark-icon\" aria-hidden=\"true\">✦\u003c/span> LA PREUVE \u003cem>LAB\u003c/em>\u003c/a>\u003cnav class=\"ak-links\" aria-label=\"Navigation principale\">\u003ca href=\"index.html\">Livre\u003c/a>\u003ca href=\"app.html\">LA PREUVE LAB\u003c/a>\u003ca href=\"workbench.html\" aria-current=\"page\">QM Workbench\u003c/a>\u003ca href=\"studio.html\">Studio interactif\u003c/a>\u003ca href=\"evaluation.html\">Étude pilote\u003c/a>\u003c/nav>\u003c/div>\u003c/header>\u003csection class=\"ak-welcome\" aria-labelledby=\"ak-title\">\u003cdiv class=\"ak-welcome-body\">\u003cspan class=\"ak-eyebrow\">Mounir Akarkach · La preuve avant le diagnostic · Recherche 2026\u003c/span>\u003ch2 id=\"ak-title\">Bienvenue dans votre atelier qualité.\u003c/h2>\u003cdiv class=\"ak-accent-line\">\u003c/div>\u003cp>La Workbench relie contrôles automatiques, règles, écarts et actions correctives. Démarrez avec un seul cycle : 48 dossiers fictifs, puis explorez les résultats.\u003c/p>\u003cdiv class=\"ak-guide\" aria-label=\"Guide de démarrage\">\u003ca class=\"ak-guide-step\" href=\"#dashboard\" data-ak-pane=\"dashboard\">\u003cspan class=\"ak-num\" aria-hidden=\"true\">1\u003c/span>\u003cspan>\u003cb>Lancer 48 cas\u003c/b>\u003csmall>Sélectionner « 1 cycle » puis exécuter.\u003c/small>\u003c/span>\u003c/a>\u003ca class=\"ak-guide-step\" href=\"#deviations\" data-ak-pane=\"deviations\">\u003cspan class=\"ak-num\" aria-hidden=\"true\">2\u003c/span>\u003cspan>\u003cb>Examiner les écarts\u003c/b>\u003csmall>Consulter les priorités et les règles.\u003c/small>\u003c/span>\u003c/a>\u003ca class=\"ak-guide-step\" href=\"#capa\" data-ak-pane=\"capa\">\u003cspan class=\"ak-num\" aria-hidden=\"true\">3\u003c/span>\u003cspan>\u003cb>Documenter et rejouer\u003c/b>\u003csmall>Compléter les CAPA, lancer le replay, exporter.\u003c/small>\u003c/span>\u003c/a>\u003c/div>\u003cdiv class=\"ak-guide-foot\">\u003ca class=\"ak-action\" href=\"#dashboard\">Accéder au tableau de bord →\u003c/a>\u003cdetails class=\"ak-details\">\u003csummary>Guide d'utilisation et limites\u003c/summary>\u003cp>Aucune action corrective ne débloque un résultat clinique. Le replay vérifie la cohérence d'un exercice, pas une décision médicale. \u003ca href=\"index.html\">Comprendre le livre\u003c/a> · \u003ca href=\"workbench.html\">Explorer les règles QM\u003c/a> · \u003ca href=\"app.html\">Ouvrir la simulation.\u003c/a>\u003c/p>\u003c/details>\u003cspan class=\"ak-purpose\">Gate 2 clinique : BLOCK\u003c/span>\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"hero\">\u003cdiv class=\"wrap\">\u003cdiv class=\"eyebrow\">Nouveau · Workbench v3.0 · qualité documentaire\u003c/div>\u003ch1>Contrôler. Prioriser.\u003cbr>Corriger. Prouver.\u003c/h1>\u003cp class=\"lead\">Atelier expérimental de précontrôle automatique, règles de qualité, écarts et mesures correctives, sans connexion à un laboratoire et sans décision médicale.\u003c/p>\u003cdiv class=\"pills\">\u003cspan class=\"pill\">100 % simulation locale\u003c/span>\u003cspan class=\"pill\">PIGA Gate 1 : documentaire\u003c/span>\u003cspan class=\"pill block\">Gate 2 : BLOCK clinique\u003c/span>\u003cspan class=\"pill\">A7SEM Reverse · boucle bornée\u003c/span>\u003c/div>\n\u003cdiv class=\"warning\">\u003cb>CAS SYNTHÉTIQUES EXCLUSIVEMENT.\u003c/b> Aucun résultat patient, nom, fichier médical ou identifiant réel. Les mesures correctives concernent uniquement les fiches pédagogiques. Cette application n'est ni un logiciel de diagnostic, ni un SIL/LIMS, ni un système d'audit certifié. Ne saisissez aucune information personnelle ou sensible.\u003c/div>\u003c/div>\u003c/section>\n\u003cmain id=\"ak-main\" class=\"wrap\">\n\u003cnav class=\"tabs\" role=\"tablist\" aria-label=\"Modules Workbench\">\n\u003cbutton class=\"tab\" aria-selected=\"true\" data-page=\"dashboard\">Vue d'ensemble\u003c/button>\u003cbutton class=\"tab\" aria-selected=\"false\" data-page=\"rules\">Règles QM\u003c/button>\u003cbutton class=\"tab\" aria-selected=\"false\" data-page=\"deviations\">Écarts & priorités\u003c/button>\u003cbutton class=\"tab\" aria-selected=\"false\" data-page=\"capa\">Actions correctives\u003c/button>\u003cbutton class=\"tab\" aria-selected=\"false\" data-page=\"trace\">Traçabilité & replay\u003c/button>\u003c/nav>\n\u003csection class=\"pane active\" id=\"dashboard\">\u003cdiv class=\"surface\">\u003cdiv class=\"grid\">\u003cdiv>\u003ch2>Contrôle automatisé des prérequis\u003c/h2>\u003cp class=\"muted\">Exécutez un workflow fini sur \u003cb>48 scénarios documentaires synthétiques par cycle\u003c/b>. Chaque cycle vérifie les mêmes catégories avec des valeurs fictives déterministes. Aucun serveur et aucune inférence clinique.\u003c/p>\u003c/div>\u003cdiv class=\"card\">\u003cdiv class=\"field\">\u003clabel for=\"rounds\">Nombre de cycles (1 à 8)\u003c/label>\u003cselect id=\"rounds\">\u003coption value=\"1\">1 cycle · 48 cas\u003c/option>\u003coption value=\"2\">2 cycles · 96 cas\u003c/option>\u003coption value=\"4\" selected>4 cycles · 192 cas\u003c/option>\u003coption value=\"8\">8 cycles · 384 cas\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton id=\"run\">Lancer le précontrôle\u003c/button>\u003cbutton class=\"secondary\" id=\"reset\">Réinitialiser\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"four\" aria-label=\"Indicateurs de session\">\u003cdiv class=\"metric\">\u003cstrong id=\"m-total\">0\u003c/strong>\u003cspan>Contrôles documentaires\u003c/span>\u003c/div>\u003cdiv class=\"metric\">\u003cstrong id=\"m-allow\">0\u003c/strong>\u003cspan>ALLOW documentaire\u003c/span>\u003c/div>\u003cdiv class=\"metric\">\u003cstrong id=\"m-hold\">0\u003c/strong>\u003cspan>DELAY / UNKNOWN / BLOCK\u003c/span>\u003c/div>\u003cdiv class=\"metric\">\u003cstrong id=\"m-capa\">0\u003c/strong>\u003cspan>Écarts à traiter (uniques)\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"note\" id=\"overview\" role=\"status\" aria-live=\"polite\">Aucun test lancé. Cliquez sur « Lancer le précontrôle » pour générer des cas entièrement fictifs.\u003c/div>\u003c/div>\n\u003cdiv class=\"surface\">\u003ch2>Chaîne A7SEM · vérifications explicites\u003c/h2>\u003cdiv class=\"steps\">\u003cdiv class=\"step\">\u003cb>1 · IDENTITÉ\u003c/b>\u003cdiv>Code fictif et correspondance\u003c/div>\u003c/div>\u003cdiv class=\"step\">\u003cb>2 · PRÉANALYTIQUE\u003c/b>\u003cdiv>Prélèvement, interférence\u003c/div>\u003c/div>\u003cdiv class=\"step\">\u003cb>3 · PROVENANCE\u003c/b>\u003cdiv>Référence et version\u003c/div>\u003c/div>\u003cdiv class=\"step\">\u003cb>4 · MÉTHODE\u003c/b>\u003cdiv>Instrument et unité\u003c/div>\u003c/div>\u003cdiv class=\"step\">\u003cb>5 · COHÉRENCE\u003c/b>\u003cdiv>Bornes et contradictions\u003c/div>\u003c/div>\u003cdiv class=\"step\">\u003cb>6 · QM\u003c/b>\u003cdiv>Écarts, remédiation\u003c/div>\u003c/div>\u003cdiv class=\"step\">\u003cb>7 · REVERSE\u003c/b>\u003cdiv>Replay et preuve\u003c/div>\u003c/div>\u003c/div>\u003cp class=\"fine muted\">Séquence pédagogique inspirée de PIGA/A7SEM : aucune certification méthodologique ou médicale revendiquée.\u003c/p>\u003c/div>\n\u003cdiv class=\"surface\">\u003ch2>Derniers contrôles\u003c/h2>\u003cdiv class=\"data-table\" id=\"case-table\">\u003cp class=\"muted\">Aucune ligne.\u003c/p>\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"pane\" id=\"rules\">\u003cdiv class=\"surface\">\u003ch2>Catalogue de règles QM versionné\u003c/h2>\u003cp class=\"muted\">Les \u003cb>règles fondamentales de sécurité\u003c/b> restent actives et ne peuvent pas être désactivées (identité, qualité, interférence et incohérence des bornes). Les règles additionnelles ajustent seulement le contrôle documentaire, jamais l'autorisation clinique.\u003c/p>\u003cdiv class=\"note\">\u003cstrong id=\"rules-version\">Règles v1\u003c/strong> · Gate 2 demeure BLOCK · Opérations additionnelles limitées à DELAY/BLOCK.\u003c/div>\u003ch3 style=\"margin-top:18px\">Règles fondamentales (inaltérables)\u003c/h3>\u003cdiv id=\"core-rules\" class=\"grid\">\u003c/div>\u003ch3 style=\"margin-top:18px\">Règles additionnelles\u003c/h3>\u003cdiv id=\"custom-rules\" class=\"data-table\">\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>Ajouter une règle documentaire\u003c/h3>\u003cdiv class=\"three\">\u003cdiv class=\"field\">\u003clabel for=\"rule-field\">Champ\u003c/label>\u003cselect id=\"rule-field\">\u003coption value=\"source\">Source\u003c/option>\u003coption value=\"method\">Méthode\u003c/option>\u003coption value=\"sample\">Type de prélèvement\u003c/option>\u003coption value=\"population\">Population\u003c/option>\u003coption value=\"unit\">Unité\u003c/option>\u003coption value=\"identity\">Identité fictive\u003c/option>\u003coption value=\"quality\">Contrôle qualité\u003c/option>\u003coption value=\"interference\">Interférence\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"rule-operator\">Condition\u003c/label>\u003cselect id=\"rule-operator\">\u003coption value=\"empty\">Champ vide\u003c/option>\u003coption value=\"eq\">Égal à une valeur\u003c/option>\u003coption value=\"neq\">Différent d'une valeur\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"rule-value\">Valeur (si nécessaire)\u003c/label>\u003cinput id=\"rule-value\" maxlength=\"40\" placeholder=\"unknown / yes / no\">\u003c/div>\u003c/div>\u003cdiv class=\"three\">\u003cdiv class=\"field\">\u003clabel for=\"rule-outcome\">Effet documentaire\u003c/label>\u003cselect id=\"rule-outcome\">\u003coption value=\"DELAY\">DELAY\u003c/option>\u003coption value=\"BLOCK\">BLOCK\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"rule-level\">Priorité proposée\u003c/label>\u003cselect id=\"rule-level\">\u003coption value=\"P3\">P3 · faible\u003c/option>\u003coption value=\"P2\">P2 · moyenne\u003c/option>\u003coption value=\"P1\">P1 · élevée\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"rule-name\">Nom court de règle\u003c/label>\u003cinput id=\"rule-name\" maxlength=\"80\" placeholder=\"Ex. Référence de méthode absente\">\u003c/div>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton id=\"rule-add\">Ajouter et versionner\u003c/button>\u003cbutton class=\"ghost\" id=\"rules-restore\">Restaurer règles additionnelles\u003c/button>\u003c/div>\u003cdiv id=\"rule-feedback\" class=\"status muted\" aria-live=\"polite\">\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"pane\" id=\"deviations\">\u003cdiv class=\"surface\">\u003ch2>Écarts documentaires priorisés\u003c/h2>\u003cp class=\"muted\">Chaque écart est relié à un cas SYN-, à sa règle déclenchée, à un niveau P1/P2/P3, à une justification et à la version des règles utilisée lors du contrôle.\u003c/p>\u003cdiv class=\"actions\">\u003clabel class=\"field\">Filtrer \u003cselect id=\"deviation-filter\">\u003coption value=\"ALL\">Toutes les priorités\u003c/option>\u003coption value=\"P1\">P1 · élevée\u003c/option>\u003coption value=\"P2\">P2 · moyenne\u003c/option>\u003coption value=\"P3\">P3 · faible\u003c/option>\u003c/select>\u003c/label>\u003cbutton class=\"secondary\" id=\"deviation-export\">Exporter les écarts CSV\u003c/button>\u003c/div>\u003cdiv id=\"deviation-count\" class=\"muted fine\">\u003c/div>\u003cdiv id=\"deviation-table\" class=\"data-table\">\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"pane\" id=\"capa\">\u003cdiv class=\"surface\">\u003ch2>Actions correctives (CAPA pédagogiques)\u003c/h2>\u003cp class=\"muted\">Chaque écart dispose d'un suivi \u003cb>OUVERT → EN COURS → REVU\u003c/b>. « REVU » signifie uniquement qu'une justification documentaire fictive a été saisie. Ce n'est \u003cb>pas\u003c/b> une validation humaine, une correction d'un vrai résultat ou une levée du Gate 2.\u003c/p>\u003cdiv class=\"three\">\u003cdiv class=\"metric\">\u003cstrong id=\"c-open\">0\u003c/strong>\u003cspan>Ouvertes\u003c/span>\u003c/div>\u003cdiv class=\"metric\">\u003cstrong id=\"c-progress\">0\u003c/strong>\u003cspan>En cours\u003c/span>\u003c/div>\u003cdiv class=\"metric\">\u003cstrong id=\"c-reviewed\">0\u003c/strong>\u003cspan>Revues (simulation)\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton class=\"secondary\" id=\"capa-prev\">← Précédent\u003c/button>\u003cspan id=\"capa-page\" class=\"muted fine\">\u003c/span>\u003cbutton class=\"secondary\" id=\"capa-next\">Suivant →\u003c/button>\u003c/div>\u003cdiv id=\"capa-list\" style=\"margin-top:16px\">\u003c/div>\u003cdiv class=\"note\" id=\"capa-feedback\" aria-live=\"polite\">Les corrections ne modifient pas rétrospectivement la décision d'un contrôle : exécutez un nouveau cycle pour obtenir une nouvelle preuve.\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"pane\" id=\"trace\">\u003cdiv class=\"surface\">\u003ch2>Journal Glassbox et replay déterministe\u003c/h2>\u003cp class=\"muted\">Le journal relie la version des règles, les entrées synthétiques, les résultats et les changements CAPA. Le replay recalcule le \u003cem>snapshot initial\u003c/em> sans réécrire l'histoire, et signale toute divergence. Les preuves restent en mémoire volatile jusqu'à export volontaire.\u003c/p>\u003cdiv class=\"actions\">\u003cbutton id=\"replay\">Vérifier le replay\u003c/button>\u003cbutton class=\"secondary\" id=\"export-json\">Exporter le dossier JSON\u003c/button>\u003cbutton class=\"secondary\" id=\"export-csv\">Exporter les contrôles CSV\u003c/button>\u003cbutton class=\"secondary\" id=\"export-report\">Imprimer / PDF\u003c/button>\u003c/div>\u003cdiv class=\"grid\">\u003cdiv class=\"card\">\u003ch3>Identité du scénario\u003c/h3>\u003cp id=\"source-summary\">Aucun workflow.\u003c/p>\u003cp class=\"fine muted\">SHA-256 d'un fichier exporté possible par WebCrypto. Une empreinte sans signature externe n'est pas une preuve juridiquement inaltérable.\u003c/p>\u003c/div>\u003cdiv class=\"card\">\u003ch3>Résultat du replay\u003c/h3>\u003cdiv id=\"replay-result\" class=\"note\" role=\"status\" aria-live=\"polite\">Non exécuté.\u003c/div>\u003c/div>\u003c/div>\u003ch3>Événements récents\u003c/h3>\u003cdiv id=\"event-table\" class=\"data-table\">\u003c/div>\u003cdiv class=\"card\" style=\"margin-top:17px\">\u003ch3>Reprendre une simulation exportée\u003c/h3>\u003cdiv class=\"field\">\u003clabel for=\"import-file\">Importer un export JSON de cette Workbench (max. 1 Mo) · SYN- seulement\u003c/label>\u003cinput type=\"file\" id=\"import-file\" accept=\".json,application/json\">\u003c/div>\u003cdiv class=\"actions\">\u003cbutton class=\"secondary\" id=\"import\">Ouvrir l'archive validée\u003c/button>\u003cbutton class=\"danger\" id=\"wipe\">Effacer la session locale\u003c/button>\u003c/div>\u003cdiv id=\"import-status\" class=\"muted fine\" role=\"status\">\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003c/main>\u003cfooter>\u003cdiv class=\"wrap\">© 2026 Mounir Akarkach · LA PREUVE LAB Workbench 3.0 · Recherche documentaire / cas fictifs exclusivement · \u003ca href=\"licence.html\">Licence\u003c/a> · \u003ca href=\"confidentialite.html\">Confidentialité\u003c/a>\u003c/div>\u003c/footer>\n\u003cscript>\n(function(){'use strict';\nconst SCHEMA='lapreuve.workbench.v3',VERSION='3.0', FIELDS=['ref','analyte','value','lower','upper','unit','source','method','sample','population','identity','quality','interference'];\nconst CUSTOM_FIELDS=['source','method','sample','population','unit','identity','quality','interference'];\nconst STOP_ORDER={ALLOW:0,DELAY:1,UNKNOWN:2,BLOCK:3};\nconst priorityRank={P1:0,P2:1,P3:2};\nconst coreRules=[\n {id:'CORE-ID',title:'Correspondance échantillon',field:'identity',condition:'no',outcome:'BLOCK',priority:'P1'},\n {id:'CORE-QC',title:'Contrôle qualité non conforme',field:'quality',condition:'no',outcome:'BLOCK',priority:'P1'},\n {id:'CORE-INT',title:'Interférence suspectée',field:'interference',condition:'yes',outcome:'BLOCK',priority:'P1'},\n {id:'CORE-NUM',title:'Valeur ou intervalle invalide',field:'value, lower, upper',condition:'not_finite / lower >= upper',outcome:'UNKNOWN',priority:'P2'},\n {id:'CORE-META',title:'Document incomplet',field:'analyte, unit, source, method, sample, population',condition:'empty',outcome:'DELAY',priority:'P3'},\n {id:'CORE-UNC',title:'Identité / qualité / interférence inconnue',field:'identity, quality, interference',condition:'unknown',outcome:'DELAY',priority:'P3'}];\nfunction $(id){return document.getElementById(id)}\nfunction esc(s){return String(s??'').replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));}\nfunction plain(s){return String(s??'').trim();}\nfunction intNum(s){if(plain(s)==='')return NaN;let n=Number(s);return Number.isFinite(n)?n:NaN;}\nfunction jsonClone(v){return JSON.parse(JSON.stringify(v));}\nfunction stable(value){if(Array.isArray(value))return '['+value.map(stable).join(',')+']';if(value&&typeof value==='object')return '{'+Object.keys(value).sort().map(k=>JSON.stringify(k)+':'+stable(value[k])).join(',')+'}';return JSON.stringify(value);}\nfunction makeCase(i,cycle=0){\n const group=i%12,id='SYN-'+String(cycle+1).padStart(2,'0')+'-'+String(i+1).padStart(3,'0');\n const lo=110+((i*13+cycle*17)%51),hi=lo+25+(i%7),x={ref:id,analyte:'ANALYTE_FICTIF',value:String(lo+9),lower:String(lo),upper:String(hi),unit:'U_fictive',source:'Référence_fictive_v1',method:'Appareil_fictif',sample:'Échantillon_fictif',population:'Population_fictive',identity:'yes',quality:'yes',interference:'no'};\n if(group===1)x.value=String(lo-7);if(group===2)x.value=String(hi+5);if(group===3)x.source='';if(group===4)x.method='';if(group===5)x.population='';if(group===6)x.quality='unknown';if(group===7)x.identity='unknown';if(group===8)x.identity='no';if(group===9)x.quality='no';if(group===10)x.interference='yes';if(group===11)x.upper=String(lo-1);\n return x;\n}\nfunction defaults(){return [{id:'Q-001',name:'Traçabilité de la source',field:'source',op:'empty',value:'',outcome:'DELAY',priority:'P3',enabled:true},{id:'Q-002',name:'Méthode renseignée',field:'method',op:'empty',value:'',outcome:'DELAY',priority:'P3',enabled:true},{id:'Q-003',name:'Interférence non examinée',field:'interference',op:'eq',value:'unknown',outcome:'DELAY',priority:'P2',enabled:true}];}\nfunction validRule(r){return r&&typeof r==='object'&&/^Q-[A-Za-z0-9-]{1,32}$/.test(r.id)&&typeof r.name==='string'&&r.name.length>=2&&r.name.length\u003c=80&&CUSTOM_FIELDS.includes(r.field)&&['empty','eq','neq'].includes(r.op)&&typeof r.value==='string'&&r.value.length\u003c=40&&['DELAY','BLOCK'].includes(r.outcome)&&['P1','P2','P3'].includes(r.priority)&&typeof r.enabled==='boolean'&& (r.op==='empty'||r.value.trim().length>0);}\nfunction numberValid(row){const v=intNum(row.value),lo=intNum(row.lower),hi=intNum(row.upper);return Number.isFinite(v)&&Number.isFinite(lo)&&Number.isFinite(hi)&&lo\u003chi;}\nfunction evaluate(row,rules=[]){\n const issues=[];const add=(ruleId,reason,state,priority)=>issues.push({ruleId,reason,state,priority});\n if(row.identity==='no')add('CORE-ID','Identité du prélèvement fictif non conforme','BLOCK','P1');\n if(row.quality==='no')add('CORE-QC','Contrôle qualité déclaré non conforme','BLOCK','P1');\n if(row.interference==='yes')add('CORE-INT','Interférence présente ou suspectée','BLOCK','P1');\n const valid=numberValid(row);\n if(!valid)add('CORE-NUM','Valeur ou bornes numériques non valides','UNKNOWN','P2');\n if(valid){\n  const missing=['analyte','unit','source','method','sample','population'].filter(k=>!plain(row[k]));\n  if(missing.length)add('CORE-META','Documentation manquante : '+missing.join(', '),'DELAY','P3');\n  if(['identity','quality','interference'].some(k=>!['yes','no','unknown'].includes(row[k])||row[k]==='unknown'))add('CORE-UNC','Qualité, identité ou interférence non vérifiée','DELAY','P3');\n }\n for(const r of rules){if(!r.enabled||!validRule(r))continue;let matched=r.op==='empty'?!plain(row[r.field]):r.op==='eq'?plain(row[r.field])===r.value:plain(row[r.field])!==r.value;\n if(matched)add(r.id,'Règle personnalisée : '+r.name,r.outcome,r.priority);\n }\n const state=issues.reduce((s,x)=>STOP_ORDER[x.state]>STOP_ORDER[s]?x.state:s,'ALLOW');\n const lo=intNum(row.lower),hi=intNum(row.upper),val=intNum(row.value);\n const comparison=!valid?'Non calculable':val\u003clo?'Sous intervalle fourni':val>hi?'Au-dessus intervalle fourni':'Dans intervalle fourni';\n return {ref:row.ref,gate1:state,gate2:'BLOCK',comparison,issues,admittedScope:state==='ALLOW'?'COMPARAISON_DOCUMENTAIRE_SEULEMENT':'SUSPENDU_DOCUMENTAIREMENT'};\n}\nfunction validCase(row){return row&&typeof row==='object'&&FIELDS.every(k=>typeof row[k]==='string'&&row[k].length\u003c=150)&&/^SYN-[A-Za-z0-9_-]{1,48}$/.test(row.ref)&&['yes','no','unknown'].includes(row.identity)&&['yes','no','unknown'].includes(row.quality)&&['yes','no','unknown'].includes(row.interference);}\nfunction runSuite(rounds,rules){if(!Number.isInteger(rounds)||rounds\u003c1||rounds>8||rules.length>20||!rules.every(validRule))throw Error('Borne de cycle ou règles invalides');\n const cases=[],results=[],deviations=new Map();\n for(let cycle=0;cycle\u003crounds;cycle++)for(let i=0;i\u003c48;i++){\n  const x=makeCase(i,cycle);if(!validCase(x))throw Error('Source SYN invalide');cases.push(x);\n  const result=evaluate(x,rules);results.push(result);\n  for(const issue of result.issues){const id=x.ref+'::'+issue.ruleId;if(!deviations.has(id))deviations.set(id,{id,ref:x.ref,ruleId:issue.ruleId,priority:issue.priority,reason:issue.reason,state:issue.state});}\n }\n return {cases,results,deviations:[...deviations.values()].sort((a,b)=>priorityRank[a.priority]-priorityRank[b.priority]||a.id.localeCompare(b.id))};\n}\nfunction verify(snapshot){if(!snapshot||!snapshot.rules||!snapshot.cases||!snapshot.results)return {pass:false,message:'Snapshot absent'};\n if(snapshot.cases.length!==snapshot.results.length)return {pass:false,message:'Taille incohérente'};\n for(let i=0;i\u003csnapshot.cases.length;i++){\n  if(!validCase(snapshot.cases[i]))return {pass:false,message:'Cas SYN invalide '+i};\n  if(stable(evaluate(snapshot.cases[i],snapshot.rules))!==stable(snapshot.results[i]))return {pass:false,index:i,message:'Écart à la ligne '+(i+1)};\n }\n return {pass:true,checked:snapshot.cases.length,message:'Concordance '+snapshot.cases.length+'/'+snapshot.cases.length+' · Gate 2 BLOCK'};\n}\nfunction initial(){return {rules:defaults(),version:1,workflow:null,capa:{},events:[],seq:0,rounds:0,phase:'EMPTY'};}\nlet state=initial(),capaPage=0;\nfunction event(kind,detail){state.events.push({seq:++state.seq,kind,detail,time:new Date().toISOString()});if(state.events.length>1000)state.events.shift();}\nfunction paint(){renderDashboard();renderRules();renderDeviations();renderCapa();renderTrace();}\nfunction table(headers,rows){return '\u003ctable>\u003cthead>\u003ctr>'+headers.map(x=>'\u003cth>'+esc(x)+'\u003c/th>').join('')+'\u003c/tr>\u003c/thead>\u003ctbody>'+rows.join('')+'\u003c/tbody>\u003c/table>';}\nfunction renderDashboard(){let wf=state.workflow,counts={ALLOW:0,DELAY:0,UNKNOWN:0,BLOCK:0};if(wf)wf.results.forEach(r=>counts[r.gate1]++);\n $('m-total').textContent=wf?wf.results.length:'0';$('m-allow').textContent=counts.ALLOW;$('m-hold').textContent=counts.DELAY+counts.UNKNOWN+counts.BLOCK;$('m-capa').textContent=wf?wf.deviations.length:'0';\n $('overview').textContent=wf?'Prérequis contrôlés sur '+wf.results.length+' simulations. ALLOW '+counts.ALLOW+' · DELAY '+counts.DELAY+' · UNKNOWN '+counts.UNKNOWN+' · BLOCK '+counts.BLOCK+'. Chaque résultat a Gate 2 = BLOCK; revue humaine de données réelles non autorisée.':'Aucun test lancé. Simulations fictives uniquement.';\n $('case-table').innerHTML=wf?table(['Code SYN','Gate 1','Comparaison','Écarts','Gate 2'],wf.results.slice(0,90).map(r=>'\u003ctr>\u003ctd>\u003ccode>'+esc(r.ref)+'\u003c/code>\u003c/td>\u003ctd>\u003cspan class=\"pill '+r.gate1.toLowerCase()+'\">'+r.gate1+'\u003c/span>\u003c/td>\u003ctd>'+esc(r.comparison)+'\u003c/td>\u003ctd>'+r.issues.length+'\u003c/td>\u003ctd>BLOCK\u003c/td>\u003c/tr>')):'\u003cp class=\"muted\">Aucun contrôle.\u003c/p>';\n}\nfunction renderRules(){\n $('rules-version').textContent='Règles v'+state.version;\n $('core-rules').innerHTML=coreRules.map(r=>'\u003cdiv class=\"card\">\u003cstrong>'+esc(r.id)+'\u003c/strong> · '+esc(r.title)+'\u003cdiv class=\"fine muted\">'+esc(r.field)+' · '+esc(r.condition)+' · '+esc(r.outcome)+' · '+esc(r.priority)+'\u003c/div>\u003c/div>').join('');\n $('custom-rules').innerHTML=table(['Règle','Condition','Effet','Active','Gestion'],state.rules.map(r=>'\u003ctr>\u003ctd>\u003cstrong>'+esc(r.id)+'\u003c/strong> · '+esc(r.name)+'\u003c/td>\u003ctd>'+esc(r.field)+' / '+esc };\n if(to==='REVIEWED'&&plain(note).length\u003c12)return {ok:false,message:'Pour REVU, rédigez au moins 12 caractères de justification fictive.'};\n if(note.length>300)return {ok:false,message:'Texte trop long'};\n c.stage=to;c.note=plain(note);c.history.push({to,at:new Date().toISOString(),note:c.note});state.capa[id]=c;event('CAPA_STEP',{id,to,note:c.note});return {ok:true,message:'CAPA '+id+' → '+to+' (pédagogique; Gate 2 reste BLOCK)'};\n}\nfunction renderTrace(){let wf=state.workflow;\n $('source-summary').textContent=wf?'Règles snapshot v'+wf.rulesVersion+' · '+wf.cases.length+' cas · '+state.rounds+' cycle(s) · aucune donnée réelle · statut de recherche.':'Aucun workflow disponible.';\n $('event-table').innerHTML=state.events.length?table(['#','Événement','Horodatage local ISO','Détail'],state.events.slice(-70).reverse().map(e=>'\u003ctr>\u003ctd>'+e.seq+'\u003c/td>\u003ctd>'+esc(e.kind)+'\u003c/td>\u003ctd>'+esc(e.time)+'\u003c/td>\u003ctd>'+esc(stable(e.detail).slice(0,170))+'\u003c/td>\u003c/tr>')):'\u003cp class=\"muted\">Aucun événement.\u003c/p>';\n}\nfunction reset(){state=initial();capaPage=0;event('RESET',{scope:'SYNTHETIC_ONLY'});$('replay-result').textContent='Non exécuté.';paint();}\nfunction execute(rounds){const rules=jsonClone(state.rules),data=runSuite(rounds,rules);\n state.workflow={rulesVersion:state.version,rules,cases:data.cases,results:data.results,deviations:data.deviations};state.rounds=rounds;capaPage=0;state.capa=Object.fromEntries(data.deviations.map(d=>[d.id,{stage:'OPEN',note:'',history:[]}]));state.phase='RUN_COMPLETE';\n event('RUN_COMPLETE',{cases:data.cases.length,issues:data.deviations.length,ruleVersion:state.version,gate2:'BLOCK'});paint();return state.workflow;\n}\nfunction save(name,text,mime){let blob=new Blob([text],{type:mime}),uri=URL.createObjectURL(blob),a=document.createElement('a');a.href=uri;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(uri),1000);}\nfunction csvCell(value){let s=String(value??'');if(/^[=+@]/.test(s)||/^-(?!\\d+(?:\\.\\d+)?$)/.test(s))s=\"'\"+s;return '\"'+s.replace(/\"/g,'\"\"')+'\"'}\nfunction makeCsv(items,keys){return '\\uFEFF'+[keys].concat(items.map(x=>keys.map(k=>x[k]))).map(row=>row.map(csvCell).join(';')).join('\\r\\n')+'\\r\\n';}\nasync function digest(text){if(typeof crypto==='undefined'||!crypto.subtle||typeof TextEncoder==='undefined')return null;let bytes=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));return [...new Uint8Array(bytes)].map(x=>x.toString(16).padStart(2,'0')).join('');}\nasync function exportJson(){const payload={schema:SCHEMA,version:VERSION,gate2:'BLOCK',synthetic:true,createdAt:new Date().toISOString(),project:jsonClone(state)};\n const serial=stable(payload),hash=await digest(serial);save('LA_PREUVE_LAB_QM_WORKBENCH_SYNTHETIQUE.json',JSON.stringify({payload,canonicalSha256:hash,hashAlgorithm:hash?'SHA-256':'NOT_AVAILABLE_NO_CLAIM'},null,2),'application/json');}\nfunction exportedStateValid(o){if(!o||o.schema!==SCHEMA||o.version!==VERSION||o.synthetic!==true||o.gate2!=='BLOCK')return false;\n const st=o.project;if(!st||!Array.isArray(st.rules)||st.rules.length>20||!st.rules.every(validRule)||!Number.isInteger(st.version)||st.version\u003c1||st.version>500||!Number.isInteger(st.seq)||st.seq\u003c0||!Array.isArray(st.events)||st.events.length>1000)return false;\n if(st.workflow!==null){let w=st.workflow;if(!w||!Array.isArray(w.cases)||!Array.isArray(w.results)||!Array.isArray(w.deviations)||w.cases.length!==w.results.length||w.cases.length\u003c1||w.cases.length>384||w.deviations.length>2000||!w.cases.every(validCase)||!Array.isArray(w.rules)||!w.rules.every(validRule)||!verify(w).pass)return false;\n if(w.results.some(r=>r.gate2!=='BLOCK'||!['ALLOW','DELAY','BLOCK','UNKNOWN'].includes(r.gate1)))return false;\n if(Object.keys(st.capa||{}).length>2000)return false;\n for(const [key,value] of Object.entries(st.capa||{})){if(!w.deviations.some(d=>d.id===
